<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plate">
<meta name="theme-color" content="#08050C">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2308050C'/%3E%3Ccircle cx='90' cy='90' r='58' fill='none' stroke='%23A970FF' stroke-width='14'/%3E%3Ccircle cx='90' cy='90' r='14' fill='%23A970FF'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<title>Plate — lifting log</title>
<style>
:root{
  --bg:#08050C; --bg2:#110B18; --surf:#160E20; --surf2:#1F1430;
  --line:#2E1F44; --line2:#3D2A59;
  --ink:#EFE9F7; --dim:#A395B8; --dim2:#6E6186;
  --pur:#A970FF; --pur2:#C9A2FF; --purDim:#5B3E8C;
  --hold:#7E8AB8; --back:#FF6B5B; --low:#4C4260;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
input,select,button,textarea{font-family:inherit;font-size:16px;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}

header{
  position:sticky;top:0;z-index:20;background:rgba(8,5,12,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;
}
header .mark{width:22px;height:22px;border:3.5px solid var(--pur);border-radius:50%;position:relative;flex:none}
header .mark::after{content:'';position:absolute;inset:4px;background:var(--pur);border-radius:50%}
header h1{font-size:18px}
header .sub{margin-left:auto;color:var(--dim2);font-size:13px}

main{padding:14px 16px 24px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(8,5,12,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
nav button{
  flex:1;background:none;border:0;padding:6px 2px;color:var(--dim2);
  font-size:11px;font-weight:600;display:flex;flex-direction:column;
  align-items:center;gap:4px;border-radius:10px;
}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pur2)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}
.small{font-size:13px;line-height:1.4}
.tiny{font-size:11.5px;line-height:1.35}
.mt{margin-top:12px}
.sect{font-size:13px;color:var(--dim2);font-weight:700;margin:20px 0 8px}
.btn{background:var(--surf2);border:1px solid var(--line2);color:var(--ink);
  padding:11px 14px;border-radius:11px;font-weight:600;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pur);border-color:var(--pur);color:#12061F}
.btn.wide{width:100%;display:block;text-align:center}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:9px}
.btn.ghost{background:none}
.btn.danger{color:var(--back);border-color:#4E2430}
input[type=text],input[type=number],select,textarea{
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:10px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pur)}
select{appearance:none;-webkit-appearance:none}
label.f{display:block;font-size:12px;color:var(--dim2);font-weight:600;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;
  font-size:11.5px;font-weight:600;color:var(--dim)}
.pill.pur{color:var(--pur2);border-color:var(--purDim);background:rgba(169,112,255,.10)}
.empty{text-align:center;padding:34px 16px;color:var(--dim)}
.empty h3{font-size:17px;margin-bottom:6px;color:var(--ink)}

.day{display:flex;align-items:center;gap:12px;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:14px;
  margin-bottom:10px;width:100%;text-align:left}
.day .idx{width:34px;height:34px;flex:none;border-radius:9px;
  background:rgba(169,112,255,.12);border:1px solid var(--purDim);
  display:grid;place-items:center;font-weight:700;color:var(--pur2);font-size:14px}
.day .nm{font-weight:700}
.day .mus{color:var(--dim2);font-size:12.5px;margin-top:1px}

/* superset bracket */
.ssgroup{border:1px solid var(--purDim);border-radius:16px;padding:10px;margin-bottom:12px;
  background:rgba(169,112,255,.045)}
.ssgroup .sslabel{font-size:11px;font-weight:700;color:var(--pur2);
  padding:0 4px 8px;display:flex;align-items:center;gap:6px}
.ssgroup .sslabel::after{content:'';flex:1;height:1px;background:var(--line2)}
.ssgroup .card{margin-bottom:8px}
.ssgroup .card:last-child{margin-bottom:2px}

.rx{border-left:3px solid var(--pur)}
.rx.hold{border-left-color:var(--hold)}
.rx.back{border-left-color:var(--back)}
.rx.start{border-left-color:var(--purDim)}
.rxhead{display:flex;align-items:flex-start;gap:10px}
.rxname{font-weight:700;font-size:16.5px;flex:1}
.target{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:8px 0 2px}
.target small{font-size:15px;font-weight:600;color:var(--dim);letter-spacing:0}
.cue{font-size:13px;color:var(--dim);margin-top:5px}
.cue b{color:var(--pur2);font-weight:700}
.cue.hold b{color:var(--hold)}
.cue.back b{color:var(--back)}
.note{font-size:12px;color:var(--dim2);margin-top:5px;font-style:italic}

.setrow{display:grid;grid-template-columns:26px 1fr 1fr 62px 42px;gap:7px;align-items:center;margin-top:8px}
.setrow .n{color:var(--dim2);font-size:12.5px;font-weight:700;text-align:center}
.setrow input,.setrow select{padding:9px 6px;text-align:center;font-size:15px}
.setrow .tick{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  height:40px;display:grid;place-items:center;color:var(--dim2)}
.setrow.done .tick{background:rgba(169,112,255,.18);border-color:var(--purDim);color:var(--pur2)}
.setrow.done input,.setrow.done select{opacity:.5}
.setrow .tick svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hdrow{display:grid;grid-template-columns:26px 1fr 1fr 62px 42px;gap:7px;margin-top:12px}
.hdrow span{font-size:10.5px;color:var(--dim2);font-weight:700;text-align:center}

.rest{position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));
  z-index:25;background:var(--surf2);border:1px solid var(--line2);
  border-radius:13px;padding:11px 14px;display:none;align-items:center;gap:12px;
  box-shadow:0 10px 34px rgba(0,0,0,.6);max-width:616px;margin:0 auto}
.rest.on{display:flex}
.rest .t{font-size:26px;font-weight:800;color:var(--pur2);min-width:74px}
.rest .bar{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--pur)}

.mbar{margin-bottom:13px}
.mbar .top{display:flex;align-items:baseline;justify-content:space-between;font-size:13.5px}
.mbar .nm{font-weight:600}
.mbar .v{font-weight:700}
.track{position:relative;height:12px;background:var(--bg2);border-radius:6px;margin-top:5px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.track .mev,.track .mrv{position:absolute;top:0;bottom:0;width:2px;background:var(--line2)}
.zone{position:absolute;top:0;bottom:0;background:rgba(169,112,255,.10)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim2);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.exline{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.exline:last-child{border-bottom:0}
.exline .g{flex:1;min-width:0}
.exline .t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exline .s{font-size:12px;color:var(--dim2);margin-top:1px}
.iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  width:32px;height:32px;display:grid;place-items:center;color:var(--dim);flex:none;font-size:14px}

.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(4,2,8,.72)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;
  background:var(--bg2);border-top:1px solid var(--line2);
  border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto}
.sheet h2{font-size:17px;margin-bottom:12px}
.pick{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.pick .g{flex:1}
.pick .t{font-weight:600;font-size:15px}
.pick .s{font-size:11.5px;color:var(--dim2)}

svg.chart{width:100%;height:130px;display:block;overflow:visible}
.tabs{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:11px;margin-bottom:12px}
.tabs button{flex:1;background:none;border:0;padding:8px;border-radius:8px;color:var(--dim2);font-weight:600;font-size:13.5px}
.tabs button.on{background:var(--surf2);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--surf2);border:1px solid var(--purDim);padding:10px 16px;border-radius:999px;
  font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1}
.setrow .tick.del{background:none;border-color:#4E2430;color:var(--back);font-size:17px;font-weight:700}
.hsess{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.hsess.open{border-color:var(--purDim)}
.hhead{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left;
  background:none;border:0;color:inherit}
.hhead .cv{color:var(--dim2);font-size:13px;flex:none}
.hbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.exhd{display:flex;align-items:center;gap:8px;margin:16px 0 2px}
.exhd .t{flex:1;font-weight:700;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="mark"></div>
  <h1>Plate</h1>
  <div class="sub" id="hsub"></div>
</header>

<main>
  <section class="view on" id="v-train"></section>
  <section class="view" id="v-history"></section>
  <section class="view" id="v-program"></section>
  <section class="view" id="v-volume"></section>
  <section class="view" id="v-progress"></section>
</main>

<div class="rest" id="rest">
  <div class="t num" id="restT">2:00</div>
  <div class="bar"><i id="restBar"></i></div>
  <button class="btn sm" onclick="addRest(30)">+30s</button>
  <button class="btn sm" onclick="stopRest()">Skip</button>
</div>

<nav>
  <button class="on" data-v="train"><svg viewBox="0 0 24 24"><path d="M4 9v6M8 7v10M16 7v10M20 9v6M8 12h8"/></svg>Train</button>
  <button data-v="history"><svg viewBox="0 0 24 24"><path d="M3.2 12a8.8 8.8 0 1 0 2.6-6.2M3 4.5V9h4.5M12 7.5V12l3 2"/></svg>History</button>
  <button data-v="program"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Program</button>
  <button data-v="volume"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Volume</button>
  <button data-v="progress"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 6-8M21 7h-4M21 7v4"/></svg>Progress</button>
</nav>

<div class="sheet" id="sheet"><div class="scrim" onclick="closeSheet()"></div><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== muscles + weekly landmarks (sets/week, trained-lifter averages) ===== */
const M = {
  chest:{n:'Chest',mev:10,mav:20,mrv:22},
  lats:{n:'Lats',mev:10,mav:20,mrv:25},
  upperBack:{n:'Upper back',mev:10,mav:20,mrv:25},
  traps:{n:'Traps',mev:6,mav:20,mrv:26},
  rearDelts:{n:'Rear delts',mev:6,mav:18,mrv:25},
  sideDelts:{n:'Side delts',mev:8,mav:20,mrv:26},
  frontDelts:{n:'Front delts',mev:6,mav:12,mrv:16},
  biceps:{n:'Biceps',mev:8,mav:18,mrv:26},
  triceps:{n:'Triceps',mev:6,mav:14,mrv:18},
  forearms:{n:'Forearms',mev:4,mav:12,mrv:16},
  abs:{n:'Abs',mev:6,mav:18,mrv:25},
  lowerBack:{n:'Lower back',mev:4,mav:12,mrv:16},
  glutes:{n:'Glutes',mev:4,mav:14,mrv:16},
  quads:{n:'Quads',mev:8,mav:16,mrv:20},
  hams:{n:'Hamstrings',mev:6,mav:14,mrv:20},
  calves:{n:'Calves',mev:8,mav:14,mrv:20},
  adductors:{n:'Adductors',mev:0,mav:10,mrv:14}
};
const MORDER=['chest','lats','upperBack','traps','rearDelts','sideDelts','frontDelts','biceps','triceps','forearms','abs','lowerBack','glutes','quads','hams','calves','adductors'];

/* ===== exercise library. m = fraction of a set each muscle receives ===== */
const EX = [
{id:'bp',n:'Flat barbell bench press',e:'Barbell',m:{chest:1,frontDelts:.5,triceps:.5},inc:2.5},
{id:'ibp',n:'Incline barbell bench press',e:'Barbell',m:{chest:1,frontDelts:.5,triceps:.5},inc:2.5},

{id:'idb',n:'Incline dumbbell press',e:'Dumbbell',m:{chest:1,frontDelts:.5,triceps:.5},inc:2},
{id:'mchp',n:'Chest press machine',e:'Machine',m:{chest:1,frontDelts:.4,triceps:.5},inc:2.5},

{id:'cflyh',n:'High-to-low cable fly',e:'Cable',m:{chest:1},inc:2.5},
{id:'dip',n:'Chest dip',e:'Bodyweight',m:{chest:1,triceps:.5,frontDelts:.4},inc:2.5},
{id:'pshp',n:'Push-up',e:'Bodyweight',m:{chest:1,triceps:.5,frontDelts:.4},inc:0},
{id:'pull',n:'Pull-up',e:'Bodyweight',m:{lats:1,upperBack:.4,biceps:.5,forearms:.3},inc:2.5},
{id:'chin',n:'Chin-up',e:'Bodyweight',m:{lats:1,biceps:.7,upperBack:.3},inc:2.5},
{id:'latp',n:'Lat pulldown',e:'Cable',m:{lats:1,upperBack:.4,biceps:.5,forearms:.25},inc:2.5},
{id:'latn',n:'Neutral-grip pulldown',e:'Cable',m:{lats:1,upperBack:.4,biceps:.5},inc:2.5},
{id:'sapd',n:'Straight-arm pulldown',e:'Cable',m:{lats:1,triceps:.2},inc:2.5},

{id:'drow',n:'Dumbbell row',e:'Dumbbell',m:{lats:1,upperBack:.7,biceps:.4},inc:2},

{id:'shrg',n:'Dumbbell shrug',e:'Dumbbell',m:{traps:1,forearms:.3},inc:2},
{id:'cshrg',n:'Cable shrug',e:'Cable',m:{traps:1,forearms:.3},inc:2.5},
{id:'face',n:'Face pull',e:'Cable',m:{rearDelts:1,traps:.5,upperBack:.4},inc:2.5},

{id:'dohp',n:'Seated dumbbell press',e:'Dumbbell',m:{frontDelts:1,sideDelts:.5,triceps:.5},inc:2},

{id:'rpd',n:'Rope pushdown',e:'Cable',m:{triceps:1},inc:2.5},
{id:'spd',n:'Straight-bar pushdown',e:'Cable',m:{triceps:1},inc:2.5},
{id:'ohtx',n:'Overhead cable triceps extension',e:'Cable',m:{triceps:1},inc:2.5},
{id:'skl',n:'Skull crusher',e:'Barbell',m:{triceps:1},inc:2.5},
{id:'cgb',n:'Close-grip bench press',e:'Barbell',m:{triceps:1,chest:.6,frontDelts:.4},inc:2.5},

<script>
/* ===== progression engine ===== */
function e1rm(w,reps,rir){const r=(reps||0)+(rir||0);return w>0?w*(1+r/30):0;}
function targetRirOf(cfg){return cfg.effort==='rir'?cfg.rir:0;}
function round(v,step){if(!step)return Math.round(v*2)/2;return Math.round(v/step)*step;}

function histFor(exId){
  const out=[];
  for(const s of S.history){
    const e=s.ex.find(x=>x.exId===exId);
    if(e&&e.sets.length) out.push({date:s.date,sets:e.sets});
  }
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

function prescribe(cfg){
  const h=histFor(cfg.exId);
  if(!h.length){
    if(cfg.start) return {w:cfg.start,reps:cfg.hi,kind:'start',
      cue:`Your program's starting load: <b>${cfg.start}${S.unit}</b>. Take set 1 to technical failure and log what you actually got — every session after this one gets calculated from it.`};
    return {w:null,reps:cfg.hi,kind:'start',
      cue:`First time on this. Pick a load you'd fail somewhere around <b>${cfg.hi} reps</b> with, then log it.`};
  }
  const last=h[0],top=last.sets[0],w=top.w;
  const tRir=targetRirOf(cfg);
  const doneRir=(top.rir==null?tRir:top.rir);
  const adj=top.reps+(doneRir-tRir);

  let stall=0;
  for(let i=0;i<h.length-1;i++){
    const a=h[i].sets[0],b=h[i+1].sets[0];
    if(a.w===b.w&&a.reps<=b.reps) stall++; else break;
  }
  if(stall>=2&&adj<cfg.hi){
    const nw=round(w*0.9,cfg.inc);
    return {w:nw,reps:cfg.hi,kind:'back',
      cue:`Three sessions stuck at <b>${w}${S.unit}</b>. Drop to <b>${nw}${S.unit}</b>, rebuild with clean reps, and you'll pass the old number in two or three weeks.`};
  }
  if(adj>=cfg.hi){
    if(!cfg.inc) return {w:w,reps:top.reps+1,kind:'up',
      cue:`You cleared the range. Add <b>1 rep</b>, or clip on weight and reset to ${cfg.lo}.`};
    const nw=round(w+cfg.inc,cfg.inc);
    return {w:nw,reps:cfg.lo,kind:'up',
      cue:`You got <b>${top.reps} reps</b> at the top of the range. Load goes up <b>+${cfg.inc}${S.unit}</b>, reps reset to ${cfg.lo}.`};
  }
  if(adj>=cfg.lo) return {w:w,reps:top.reps+1,kind:'hold',
    cue:`Same <b>${w}${S.unit}</b>, chase <b>${top.reps+1} reps</b>. The load only moves once you clear ${cfg.hi}.`};
  return {w:w,reps:cfg.lo,kind:'hold',
    cue:`Last time was <b>${top.reps} reps</b>, under the range. Stay at ${w}${S.unit} until you get ${cfg.lo}.`};
}

/* ===== volume maths ===== */
function volume(days){
  const cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  const sets={},freq={};
  MORDER.forEach(k=>{sets[k]=0;freq[k]=new Set()});
  for(const s of S.history){
    if(s.date<cut) continue;
    const per={};
    for(const e of s.ex){
      const ex=exById(e.exId); if(!ex) continue;
      for(const [mk,f] of Object.entries(ex.m)){
        sets[mk]+=e.sets.length*f; per[mk]=(per[mk]||0)+e.sets.length*f;
      }
    }
    for(const [mk,v] of Object.entries(per)) if(v>=2) freq[mk].add(s.date);
  }
  const out={};
  MORDER.forEach(k=>out[k]={sets:Math.round(sets[k]*10)/10,freq:freq[k].size});
  return out;
}
function plannedVolume(){
  const sets={},freq={};
  MORDER.forEach(k=>{sets[k]=0;freq[k]=0});
  for(const d of S.program.days){
    const per={};
    for(const c of d.ex){
      const ex=exById(c.exId); if(!ex) continue;
      for(const [mk,f] of Object.entries(ex.m)){ sets[mk]+=c.sets*f; per[mk]=(per[mk]||0)+c.sets*f; }
    }
    for(const [mk,v] of Object.entries(per)) if(v>=2) freq[mk]++;
  }
  const out={};
  MORDER.forEach(k=>out[k]={sets:Math.round(sets[k]*10)/10,freq:freq[k]});
  return out;
}
</script>
<script>
/* ===== render ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='train',volTab='vol',chartEx=null;

function musclesOf(day){
  const t={};
  for(const c of day.ex){const ex=exById(c.exId);if(!ex)continue;
    for(const [k,f] of Object.entries(ex.m)) if(f>=.7) t[k]=(t[k]||0)+c.sets*f;}
  return Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>M[x[0]].n).join(' · ');
}
function effortLabel(c){
  return c.effort==='all'?'every set to failure':c.effort==='first'?'set 1 to failure':c.rir+' RIR';
}
function render(){
  $('hsub').textContent=S.history.length?S.history.length+' sessions logged':'new log';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  $('v-'+tab).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  try{
    ({train:renderTrain,history:renderHistory,program:renderProgram,volume:renderVolume,progress:renderProgress})[tab]();
  }catch(err){
    console.error(err);
    $('v-'+tab).innerHTML=`<div class="empty"><h3>This screen hit an error</h3>
      <p class="small">${esc(err&&err.message||err)}</p>
      ${S.session?`<button class="btn danger mt" onclick="S.session=null;stopRest();save();render()">Discard the live session</button>`:''}</div>`;
  }
}

/* ---- train ---- */
function renderTrain(){
  const el=$('v-train');
  if(S.session) return renderSession(el);
  const last=S.history[S.history.length-1];
  let next=0;
  if(last){const i=S.program.days.findIndex(d=>d.id===last.dayId);next=i<0?0:(i+1)%S.program.days.length;}
  if(!S.program.days.length){
    el.innerHTML=`<div class="empty"><h3>No training days</h3><p class="small">Add a day in Program to start training.</p>
      <button class="btn pri mt" onclick="tab='program';render()">Go to Program</button></div>`;
    return;
  }
  el.innerHTML=`
    <div class="between" style="margin-bottom:12px"><h2 style="font-size:20px">${esc(S.program.name)}</h2></div>
    ${S.program.days.map((d,i)=>`
      <button class="day" onclick="startDay('${d.id}')">
        <div class="idx">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(d.name)}</div>
          <div class="mus">${d.ex.reduce((a,c)=>a+c.sets,0)} sets · ${musclesOf(d)||'—'}</div>
        </div>
        ${i===next&&S.history.length?'<span class="pill pur">up next</span>':''}
      </button>`).join('')}
    ${last?`<div class="sect">Last session</div>
      <div class="card small">
        <div class="between"><b>${esc(last.dayName)}</b><span class="dim2">${fmtDate(last.date)}</span></div>
        <div class="dim" style="margin-top:6px">${last.ex.map(e=>`${esc(exById(e.exId)?.n||'?')} — ${e.sets.map(s=>s.w+'×'+s.reps).join(', ')}`).join('<br>')}</div>
        <button class="btn sm wide mt" onclick="editSession('${last.id}')">Fix something in this session</button>
      </div>
      <button class="btn wide" onclick="tab='history';render();window.scrollTo(0,0)">All ${S.history.length} sessions</button>`:`<div class="empty"><h3>Nothing logged yet</h3><p class="small">Start day 1. After one session Plate tells you the exact load and reps to hit on every lift.</p></div>`}`;
}
function startDay(dayId){
  const d=S.program.days.find(x=>x.id===dayId);
  S.session={dayId,dayName:d.name,date:new Date().toISOString().slice(0,10),started:Date.now(),
    ex:d.ex.map(c=>({cfgId:c.id,exId:c.exId,sets:[]}))};
  save();render();window.scrollTo(0,0);
}
/* The live session is matched to the program by exercise id, not position,
   so editing the program (add / delete / reorder / delete a day) can't break it. */
function fallbackCfg(e){
  const ex=exById(e.exId);
  return {id:e.cfgId||e.exId,exId:e.exId,sets:Math.max(1,e.sets.filter(Boolean).length||3),
    lo:8,hi:12,rest:90,ss:null,start:null,note:'',effort:'all',rir:1,inc:ex?ex.inc:2.5};
}
function sessDay(){
  const s=S.session,day=S.program.days.find(d=>d.id===s.dayId);
  if(!day) return {name:s.dayName||'Session',ex:s.ex.map(fallbackCfg)};
  const pool=s.ex.slice(),out=[];
  for(const c of day.ex){
    let k=pool.findIndex(e=>e.cfgId===c.id);
    if(k<0) k=pool.findIndex(e=>!e.cfgId&&e.exId===c.exId);
    const e=k>=0?pool.splice(k,1)[0]:{cfgId:c.id,exId:c.exId,sets:[]};
    e.cfgId=c.id;e.exId=c.exId;out.push(e);
  }
  const extra=pool.filter(e=>e.sets.some(Boolean)); // removed from program but already logged: keep them
  s.ex=out.concat(extra);
  return {name:day.name,ex:day.ex.concat(extra.map(fallbackCfg))};
}
function renderSession(el){
  const day=sessDay();
  const total=day.ex.reduce((a,c)=>a+c.sets,0);
  const done=S.session.ex.reduce((a,e)=>a+e.sets.filter(Boolean).length,0);
  let body='',i=0;
  while(i<day.ex.length){
    const c=day.ex[i];
    if(c.ss){
      const grp=[];let j=i;
      while(j<day.ex.length&&day.ex[j].ss===c.ss){grp.push(j);j++;}
      body+=`<div class="ssgroup"><div class="sslabel">Superset — no rest between these</div>
        ${grp.map(k=>exCard(day.ex[k],k)).join('')}</div>`;
      i=j;
    }else{ body+=exCard(c,i); i++; }
  }
  el.innerHTML=`
    <div class="between" style="margin-bottom:12px">
      <div><h2 style="font-size:20px">${esc(day.name)}</h2>
      <div class="small dim2">${done} of ${total} sets · <span id="elapsed"></span></div></div>
      <button class="btn sm ghost danger" onclick="cancelSession()">Discard</button>
    </div>
    ${body}
    <button class="btn pri wide mt" onclick="finishSession()">Finish and save</button>
    <div style="height:8px"></div>`;
  tickElapsed();
}
function exCard(cfg,i){
  const ex=exById(cfg.exId)||{n:cfg.exId,e:'?'},ent=S.session.ex[i]||{sets:[]},rx=prescribe(cfg);
  const h=histFor(cfg.exId)[0];
  const first=ent.sets.filter(Boolean)[0];
  const rows=[];
  const nRows=Math.max(cfg.sets,ent.sets.length);
  for(let s=0;s<nRows;s++){
    const d=ent.sets[s],isTop=s===0;
    const base=first?first.reps:rx.reps;
    const defW=d?d.w:(first?first.w:(rx.w==null?'':rx.w));
    const defR=d?d.reps:(isTop?rx.reps:Math.max(1,base-s));
    const defQ=d?d.rir:targetRirOf(cfg);
    rows.push(`<div class="setrow ${d?'done':''}">
      <div class="n">${s+1}</div>
      <input type="number" inputmode="decimal" step="0.5" id="w_${i}_${s}" value="${defW===''?'':defW}" placeholder="${S.unit}" onchange="editLive(${i},${s})">
      <input type="number" inputmode="numeric" id="r_${i}_${s}" value="${defR||''}" placeholder="reps" onchange="editLive(${i},${s})">
      <select id="q_${i}_${s}" onchange="editLive(${i},${s})">
        ${[0,1,2,3,4].map(v=>`<option value="${v}" ${v===defQ?'selected':''}>${v===0?'fail':v+' left'}</option>`).join('')}
      </select>
      <button class="tick" onclick="${d?`unlogSet(${i},${s})`:`logSet(${i},${s})`}" aria-label="${d?'Unlog set':'Log set'}">
        <svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></button>
    </div>`);
  }
  return `<div class="card rx ${rx.kind==='up'?'':rx.kind}">
    <div class="rxhead"><div class="rxname">${esc(ex.n)}</div><span class="pill">${ex.e}</span></div>
    <div class="target num">${rx.w==null?'—':rx.w+'<small> '+S.unit+'</small>'} <span style="color:var(--dim2)">×</span> ${rx.reps}${cfg.effort==='rir'?'':'+'}</div>
    <div class="cue ${rx.kind==='up'?'':rx.kind}">${rx.cue}</div>
    ${cfg.note?`<div class="note">${esc(cfg.note)}</div>`:''}
    ${h?`<div class="tiny dim2" style="margin-top:6px">Last: ${h.sets.map(s=>`${s.w}×${s.reps}`).join('  ')} · e1RM ${Math.round(e1rm(h.sets[0].w,h.sets[0].reps,h.sets[0].rir))}${S.unit}</div>`:''}
    <div class="hdrow"><span>set</span><span>${S.unit}</span><span>reps</span><span>effort</span><span></span></div>
    ${rows.join('')}
    <div class="row mt" style="gap:8px">
      <button class="btn sm ghost" onclick="addLiveSet(${i})">+ Extra set</button>
      ${nRows>cfg.sets?`<button class="btn sm ghost" onclick="dropLiveSet(${i})">− Row</button>`:''}
    </div>
    <div class="tiny dim2" style="margin-top:9px">${cfg.sets} × ${cfg.lo}–${cfg.hi} · ${effortLabel(cfg)} · rest ${cfg.rest}s · tap a ticked ✓ to unlock that set</div>
  </div>`;
}
function logSet(i,s){
  const w=parseFloat($('w_'+i+'_'+s).value)||0;
  const r=parseInt($('r_'+i+'_'+s).value)||0;
  const q=parseInt($('q_'+i+'_'+s).value)||0;
  if(!r) return toast('Add reps first');
  const arr=S.session.ex[i].sets;
  arr[s]={w,reps:r,rir:q};
  for(let k=0;k<arr.length;k++) if(arr[k]===undefined) arr[k]=null;
  const day=sessDay();
  const cfg=day.ex[i];
  save();render();
  if(cfg.ss&&day.ex[i+1]&&day.ex[i+1].ss===cfg.ss){
    stopRest();
    toast('Straight into '+(exById(day.ex[i+1].exId)?.n||'the next one'));
  }else{
    startRest(cfg.rest);
  }
}
/* edit a set that is already ticked, without re-rendering under your thumb */
function editLive(i,s){
  const d=S.session.ex[i].sets[s]; if(!d) return;
  d.w=parseFloat($('w_'+i+'_'+s).value)||0;
  d.reps=parseInt($('r_'+i+'_'+s).value)||0;
  d.rir=parseInt($('q_'+i+'_'+s).value)||0;
  if(!d.reps){S.session.ex[i].sets[s]=null;save();render();return toast('Set removed');}
  save();
}
function unlogSet(i,s){
  S.session.ex[i].sets[s]=null;
  while(S.session.ex[i].sets.length&&S.session.ex[i].sets[S.session.ex[i].sets.length-1]==null) S.session.ex[i].sets.pop();
  save();render();toast('Set unlocked — edit and tick again');
}
function addLiveSet(i){
  const arr=S.session.ex[i].sets;
  const day=sessDay();
  const target=Math.max(day.ex[i].sets,arr.length)+1;
  while(arr.length<target-1) arr.push(null);
  arr.push(null);
  save();render();
}
function dropLiveSet(i){
  const arr=S.session.ex[i].sets;
  const day=sessDay();
  if(arr.length<=day.ex[i].sets) return;
  arr.pop();save();render();
}
function cancelSession(){if(confirm('Discard this session? Nothing gets saved.')){S.session=null;stopRest();save();render();}}
function finishSession(){
  const s=S.session;
  s.ex.forEach(e=>{e.sets=e.sets.filter(Boolean)});
  s.ex=s.ex.filter(e=>e.sets.length);
  if(!s.ex.length) return toast('No sets logged yet');
  S.history.push({id:uid(),date:s.date,dayId:s.dayId,dayName:s.dayName,ex:s.ex,
    mins:Math.round((Date.now()-s.started)/60000)});
  S.session=null;stopRest();save();tab='train';render();
  summarySheet(S.history[S.history.length-1]);
}
function summarySheet(sess){
  const day=S.program.days.find(d=>d.id===sess.dayId);
  const v={};
  for(const e of sess.ex){const ex=exById(e.exId);if(!ex)continue;
    for(const [k,f] of Object.entries(ex.m)) v[k]=(v[k]||0)+e.sets.length*f;}
  const top=Object.entries(v).sort((a,b)=>b[1]-a[1]).slice(0,6);
  openSheet(`<h2>${esc(sess.dayName)} — logged</h2>
    <div class="small dim" style="margin-bottom:10px">${sess.ex.reduce((a,e)=>a+e.sets.length,0)} sets in ${sess.mins} min</div>
    <div class="sect">Stimulus added</div>
    ${top.map(([k,n])=>`<div class="between small" style="padding:5px 0"><span>${M[k].n}</span><b class="num">${Math.round(n*10)/10} sets</b></div>`).join('')}
    <div class="sect">Next time on this day</div>
    ${(day?day.ex:[]).filter(c=>exById(c.exId)).map(c=>{const rx=prescribe(c);return `<div class="between small" style="padding:6px 0;border-bottom:1px solid var(--line)">
      <span style="flex:1">${esc(exById(c.exId).n)}</span>
      <b class="num" style="color:${rx.kind==='up'?'var(--pur2)':rx.kind==='back'?'var(--back)':'var(--hold)'}">${rx.w==null?'—':rx.w+S.unit} × ${rx.reps}</b></div>`}).join('')}
    <button class="btn pri wide mt" onclick="closeSheet()">Done</button>`);
}
function fmtDate(d){
  const dt=new Date(d+'T00:00'),n=new Date();
  const diff=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-dt)/864e5);
  if(diff===0)return 'today';if(diff===1)return 'yesterday';if(diff<7)return diff+' days ago';
  return dt.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
}
function tickElapsed(){
  const e=$('elapsed');if(!e||!S.session)return;
  e.textContent=Math.floor((Date.now()-S.session.started)/60000)+' min';
}
setInterval(tickElapsed,20000);
</script>
<script>
/* ---- rest timer ---- */
let restT=null,restLeft=0,restTotal=0;
function startRest(sec){
  restLeft=sec;restTotal=sec;$('rest').classList.add('on');
  clearInterval(restT);drawRest();
  restT=setInterval(()=>{restLeft--;drawRest();if(restLeft<=0){stopRest();beep();}},1000);
}
function drawRest(){
  const m=Math.floor(restLeft/60),s=restLeft%60;
  $('restT').textContent=m+':'+String(s).padStart(2,'0');
  $('restBar').style.width=Math.max(0,(restLeft/restTotal)*100)+'%';
}
function addRest(n){restLeft+=n;restTotal=Math.max(restTotal,restLeft);drawRest();}
function stopRest(){clearInterval(restT);$('rest').classList.remove('on');}
function beep(){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.frequency.value=680;
    g.gain.setValueAtTime(.18,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
    o.start();o.stop(c.currentTime+.5);}catch(e){}
}

/* ---- program ---- */
function renderProgram(){
  $('v-program').innerHTML=`
    <div class="between" style="margin-bottom:12px">
      <h2 style="font-size:20px">${esc(S.program.name)}</h2>
      <button class="btn sm" onclick="renameProgram()">Rename</button>
    </div>
    ${S.program.days.map(d=>`
      <div class="card">
        <div class="between" style="margin-bottom:6px">
          <div><div style="font-weight:700">${esc(d.name)}</div>
          <div class="tiny dim2">${d.ex.reduce((a,c)=>a+c.sets,0)} sets</div></div>
          <div class="row">
            <button class="iconbtn" onclick="renameDay('${d.id}')">✎</button>
            <button class="iconbtn" onclick="delDay('${d.id}')">×</button>
          </div>
        </div>
        ${d.ex.map(c=>{const ex=exById(c.exId);return `
          <div class="exline">
            <div class="g" onclick="editEx('${d.id}','${c.id}')">
              <div class="t">${c.ss?`<span style="color:var(--pur2)">${c.ss}·</span> `:''}${esc(ex?ex.n:c.exId)}</div>
              <div class="s">${c.sets}×${c.lo}–${c.hi} · ${effortLabel(c)} · +${c.inc}${S.unit} · ${c.rest}s</div>
            </div>
            <button class="iconbtn" onclick="moveEx('${d.id}','${c.id}',-1)">↑</button>
            <button class="iconbtn" onclick="moveEx('${d.id}','${c.id}',1)">↓</button>
            <button class="iconbtn" onclick="delEx('${d.id}','${c.id}')">×</button>
          </div>`}).join('')}
        <button class="btn sm wide mt" onclick="pickEx('${d.id}')">Add exercise</button>
      </div>`).join('')}
    <button class="btn wide" onclick="addDay()">Add a training day</button>
    <div class="sect">Your data</div>
    <div class="card">
      <div class="grid2">
        <button class="btn sm" onclick="exportData()">Export backup</button>
        <button class="btn sm" onclick="importData()">Import backup</button>
      </div>
      <div class="grid2 mt">
        <button class="btn sm" onclick="toggleUnit()">Units: ${S.unit}</button>
        <button class="btn sm" onclick="restoreAuto()">Restore auto-backup</button>
      </div>
      <button class="btn sm wide mt danger" onclick="wipe()">Reset to Upper 5-Day (erases history)</button>
      <p class="tiny dim2 mt">Your ${S.history.length} sessions live in this browser's storage on this device. Updating the site never touches them. Export a backup now and then anyway — clearing Safari's website data would take them with it.</p>
      <p class="tiny dim2">Build ${BUILD}</p>
    </div>`;
}
function renameProgram(){const n=prompt('Program name',S.program.name);if(n){S.program.name=n;save();render();}}
function addDay(){const n=prompt('Day name');if(n){S.program.days.push({id:uid(),name:n,ex:[]});save();render();}}
function renameDay(id){const d=S.program.days.find(x=>x.id===id);const n=prompt('Day name',d.name);if(n){d.name=n;save();render();}}
function delDay(id){if(confirm('Delete this day? Logged history stays.')){S.program.days=S.program.days.filter(x=>x.id!==id);save();render();}}
function delEx(dayId,cid){const d=S.program.days.find(x=>x.id===dayId);d.ex=d.ex.filter(c=>c.id!==cid);save();render();}
function moveEx(dayId,cid,dir){
  const d=S.program.days.find(x=>x.id===dayId),i=d.ex.findIndex(c=>c.id===cid),j=i+dir;
  if(j<0||j>=d.ex.length)return;[d.ex[i],d.ex[j]]=[d.ex[j],d.ex[i]];save();render();
}
function toggleUnit(){S.unit=S.unit==='kg'?'lb':'kg';save();render();}
function wipe(){
  if(!confirm('Reset the program and erase all '+S.history.length+' logged sessions?')) return;
  if(prompt('Type ERASE to confirm. Your last auto-backup would be the only way back.')!=='ERASE') return toast('Nothing erased');
  S=seed();save();render();
}
function editSession(id){tab='history';openHist=id;render();window.scrollTo(0,0);}

let pickTarget=null;
function pickEx(dayId){ pickTarget={kind:'day',id:dayId}; openSheet(exPickerHTML('Add an exercise')); }
function pickHistEx(sid){ pickTarget={kind:'hist',id:sid}; openSheet(exPickerHTML('Add a lift you forgot to log')); }
function exPickerHTML(title){
  const groups={};
  EX.forEach(e=>{const g=Object.entries(e.m).sort((a,b)=>b[1]-a[1])[0][0];(groups[g]=groups[g]||[]).push(e)});
  return (`<h2>${esc(title)}</h2>
    <input type="text" id="exq" placeholder="Search" oninput="filterEx()" autocomplete="off">
    <div id="exlist" class="mt">${MORDER.filter(k=>groups[k]).map(k=>`
      <div class="sect">${M[k].n}</div>
      ${groups[k].map(e=>`<div class="pick" data-n="${esc(e.n.toLowerCase())}" onclick="addExercise('${e.id}')">
        <div class="g"><div class="t">${esc(e.n)}</div>
        <div class="s">${Object.entries(e.m).map(([m,f])=>M[m].n+(f<1?' '+Math.round(f*100)+'%':'')).join(' · ')}</div></div>
        <span class="pill">${e.e}</span></div>`).join('')}`).join('')}</div>`);
}
function filterEx(){
  const q=$('exq').value.toLowerCase();
  $('exlist').querySelectorAll('.pick').forEach(p=>p.style.display=p.dataset.n.includes(q)?'':'none');
  $('exlist').querySelectorAll('.sect').forEach(s=>{
    let n=s.nextElementSibling,any=false;
    while(n&&n.classList.contains('pick')){if(n.style.display!=='none')any=true;n=n.nextElementSibling;}
    s.style.display=any?'':'none';
  });
}
function addExercise(exId){
  if(pickTarget&&pickTarget.kind==='hist'){
    const sess=S.history.find(x=>x.id===pickTarget.id);
    if(sess){ sess.ex.push({exId,sets:[{w:0,reps:0,rir:0}]}); }
    closeSheet();save();render();return;
  }
  const d=S.program.days.find(x=>x.id===pickTarget.id),ex=exById(exId);
  d.ex.push({id:uid(),exId,sets:3,lo:8,hi:12,rest:90,ss:null,start:null,note:'',effort:'all',rir:1,inc:ex.inc});
  closeSheet();save();render();
}
function editEx(dayId,cid){
  const d=S.program.days.find(x=>x.id===dayId),c=d.ex.find(x=>x.id===cid),ex=exById(c.exId);
  openSheet(`<h2>${esc(ex.n)}</h2>
    <p class="small dim" style="margin-bottom:12px">${Object.entries(ex.m).map(([m,f])=>`${M[m].n} ${Math.round(f*100)}%`).join(' · ')} — this split is how your sets get counted on the Volume screen.</p>
    <div class="grid3">
      <div><label class="f">Sets</label><input type="number" id="e_sets" value="${c.sets}" inputmode="numeric"></div>
      <div><label class="f">Min reps</label><input type="number" id="e_lo" value="${c.lo}" inputmode="numeric"></div>
      <div><label class="f">Max reps</label><input type="number" id="e_hi" value="${c.hi}" inputmode="numeric"></div>
    </div>
    <div class="grid3 mt">
      <div><label class="f">Load jump</label><input type="number" step="0.5" id="e_inc" value="${c.inc}" inputmode="decimal"></div>
      <div><label class="f">Rest (s)</label><input type="number" id="e_rest" value="${c.rest}" inputmode="numeric"></div>
      <div><label class="f">Superset</label><select id="e_ss">
        ${['','A','B','C','D'].map(g=>`<option value="${g}" ${g===(c.ss||'')?'selected':''}>${g||'none'}</option>`).join('')}</select></div>
    </div>
    <div class="grid2 mt">
      <div><label class="f">Effort</label><select id="e_eff">
        <option value="all" ${c.effort==='all'?'selected':''}>Every set to failure</option>
        <option value="first" ${c.effort==='first'?'selected':''}>Set 1 to failure</option>
        <option value="rir" ${c.effort==='rir'?'selected':''}>Leave reps in reserve</option>
      </select></div>
      <div><label class="f">Reps in reserve</label><input type="number" id="e_rir" value="${c.rir}" inputmode="numeric"></div>
    </div>
    <div class="mt"><label class="f">Note</label><input type="text" id="e_note" value="${esc(c.note||'')}" placeholder="e.g. strict, no swinging"></div>
    <p class="tiny dim2 mt">Supersets run in order — exercises sharing a letter must sit next to each other in the day. Rest only starts after the last one.</p>
    <button class="btn pri wide mt" onclick="saveEx('${dayId}','${cid}')">Save exercise</button>`);
}
function saveEx(dayId,cid){
  const d=S.program.days.find(x=>x.id===dayId),c=d.ex.find(x=>x.id===cid);
  c.sets=+$('e_sets').value||3;c.lo=+$('e_lo').value||8;c.hi=+$('e_hi').value||12;
  c.inc=+$('e_inc').value||0;c.rest=+$('e_rest').value||90;
  c.ss=$('e_ss').value||null;c.effort=$('e_eff').value;c.rir=+$('e_rir').value||0;
  c.note=$('e_note').value;
  closeSheet();save();render();
}
</script>
<script>
/* ---- history: view + edit any past session ---- */
let openHist=null;
const setCount=s=>s.ex.reduce((a,e)=>a+e.sets.length,0);
function histOrder(){
  return S.history.map((s,i)=>({s,i}))
    .sort((a,b)=>a.s.date===b.s.date?b.i-a.i:b.s.date.localeCompare(a.s.date));
}
function renderHistory(){
  const el=$('v-history');
  if(!S.history.length){
    el.innerHTML='<div class="empty"><h3>No sessions yet</h3><p class="small">Every session you finish lands here, and stays editable forever — wrong weight, wrong reps, wrong day, all fixable.</p></div>';
    return;
  }
  el.innerHTML=`
    <div class="between" style="margin-bottom:12px">
      <h2 style="font-size:20px">History</h2>
      <span class="dim2 small num">${S.history.length} sessions · ${S.history.reduce((a,s)=>a+setCount(s),0)} sets</span>
    </div>
    <div class="card small dim">Tap a session to open it. Weights, reps and effort save the moment you leave the box — you can also add or delete sets, add a lift you forgot, or move the whole session to another date.</div>
    ${histOrder().map(({s})=>histCard(s)).join('')}`;
}
function histCard(s){
  const open=openHist===s.id;
  return `<div class="hsess ${open?'open':''}">
    <button class="hhead" onclick="toggleHist('${s.id}')">
      <div style="flex:1;min-width:0">
        <div class="nm" style="font-weight:700">${esc(s.dayName||'Session')}</div>
        <div class="tiny dim2">${fmtDate(s.date)} · ${setCount(s)} sets${s.mins?' · '+s.mins+' min':''}</div>
      </div>
      <div class="cv">${open?'▲':'▼'}</div>
    </button>
    ${open?`<div class="hbody">${histEditor(s)}</div>`:`
      <div style="padding:0 14px 13px" class="tiny dim2">${s.ex.map(e=>`${esc(exById(e.exId)?.n||e.exId)} — ${e.sets.map(x=>x.w+'×'+x.reps).join(', ')}`).join('<br>')}</div>`}
  </div>`;
}
function histEditor(s){
  const body=s.ex.map((e,ei)=>{
    const ex=exById(e.exId);
    return `<div class="exhd">
        <div class="t">${esc(ex?ex.n:e.exId)}</div>
        <span class="pill">${ex?ex.e:'?'}</span>
        <button class="iconbtn" onclick="histDelEx('${s.id}',${ei})">×</button>
      </div>
      <div class="hdrow"><span>set</span><span>${S.unit}</span><span>reps</span><span>effort</span><span></span></div>
      ${e.sets.map((st,si)=>`<div class="setrow">
        <div class="n">${si+1}</div>
        <input type="number" inputmode="decimal" step="0.5" id="hw_${s.id}_${ei}_${si}" value="${st.w}" onchange="histEdit('${s.id}',${ei},${si})">
        <input type="number" inputmode="numeric" id="hr_${s.id}_${ei}_${si}" value="${st.reps}" onchange="histEdit('${s.id}',${ei},${si})">
        <select id="hq_${s.id}_${ei}_${si}" onchange="histEdit('${s.id}',${ei},${si})">
          ${[0,1,2,3,4].map(v=>`<option value="${v}" ${v===(st.rir||0)?'selected':''}>${v===0?'fail':v+' left'}</option>`).join('')}
        </select>
        <button class="tick del" onclick="histDelSet('${s.id}',${ei},${si})">×</button>
      </div>`).join('')}
      <button class="btn sm ghost mt" onclick="histAddSet('${s.id}',${ei})">+ Add set</button>`;
  }).join('');
  return `${body}
    <div class="sect">Session</div>
    <div class="grid2">
      <div><label class="f">Date</label><input type="date" id="hd_${s.id}" value="${s.date}" onchange="histDate('${s.id}',this.value)"></div>
      <div><label class="f">Minutes</label><input type="number" inputmode="numeric" value="${s.mins||0}" onchange="histMins('${s.id}',this.value)"></div>
    </div>
    <div class="grid2 mt">
      <button class="btn sm" onclick="pickHistEx('${s.id}')">Add a lift</button>
      <button class="btn sm" onclick="histRename('${s.id}')">Rename day</button>
    </div>
    <button class="btn sm wide mt danger" onclick="histDelSession('${s.id}')">Delete this session</button>
    <p class="tiny dim2 mt">Changing a past session re-runs your progression — the next prescription for those lifts updates straight away.</p>`;
}
function hSess(id){return S.history.find(x=>x.id===id);}
function toggleHist(id){openHist=openHist===id?null:id;render();}
function histEdit(id,ei,si){
  const s=hSess(id); if(!s) return;
  const st=s.ex[ei].sets[si]; if(!st) return;
  st.w=parseFloat($('hw_'+id+'_'+ei+'_'+si).value)||0;
  st.reps=parseInt($('hr_'+id+'_'+ei+'_'+si).value)||0;
  st.rir=parseInt($('hq_'+id+'_'+ei+'_'+si).value)||0;
  save();toast('Saved');
}
function histAddSet(id,ei){
  const s=hSess(id),sets=s.ex[ei].sets,last=sets[sets.length-1];
  sets.push(last?{w:last.w,reps:last.reps,rir:last.rir}:{w:0,reps:0,rir:0});
  save();render();
}
function histDelSet(id,ei,si){
  const s=hSess(id);
  s.ex[ei].sets.splice(si,1);
  if(!s.ex[ei].sets.length) s.ex.splice(ei,1);
  if(!s.ex.length){ if(confirm('That was the last set in this session. Delete the session?')){ S.history=S.history.filter(x=>x.id!==id); openHist=null; } else { s.ex.push({exId:EX[0].id,sets:[{w:0,reps:0,rir:0}]}); } }
  save();render();
}
function histDelEx(id,ei){
  const s=hSess(id),ex=exById(s.ex[ei].exId);
  if(!confirm('Remove '+(ex?ex.n:'this lift')+' from this session?')) return;
  s.ex.splice(ei,1);
  if(!s.ex.length){S.history=S.history.filter(x=>x.id!==id);openHist=null;}
  save();render();
}
function histDate(id,v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return toast('Pick a valid date');
  hSess(id).date=v;save();render();toast('Moved to '+fmtDate(v));
}
function histMins(id,v){hSess(id).mins=Math.max(0,parseInt(v)||0);save();}
function histRename(id){
  const s=hSess(id),n=prompt('What day was this?',s.dayName||'');
  if(n!==null&&n.trim()){s.dayName=n.trim();save();render();}
}
function histDelSession(id){
  const s=hSess(id);
  if(!confirm('Delete '+(s.dayName||'this session')+' from '+fmtDate(s.date)+'? This cannot be undone.')) return;
  S.history=S.history.filter(x=>x.id!==id);openHist=null;save();render();toast('Session deleted');
}
</script>
<script>
/* ---- volume ---- */
function renderVolume(){
  const done=volume(7),planned=plannedVolume();
  const bar=(k,val,freq,plan)=>{
    const m=M[k],max=Math.max(m.mrv*1.25,val*1.1,plan*1.1,10);
    const pct=v=>Math.min(100,(v/max)*100);
    const col=val<m.mev?'var(--low)':val>m.mrv?'var(--back)':'var(--pur)';
    const verdict=val===0?'not trained':val<m.mev?`${Math.ceil(m.mev-val)} sets under the minimum`:
      val>m.mrv?'over the ceiling — likely junk volume':val<m.mav?'growing':'peak range';
    return `<div class="mbar">
      <div class="top"><span class="nm">${m.n}</span>
        <span class="v num" style="color:${col}">${val} <span class="dim2" style="font-weight:500">sets</span></span></div>
      <div class="track">
        <div class="zone" style="left:${pct(m.mev)}%;width:${pct(m.mrv)-pct(m.mev)}%"></div>
        <i style="width:${pct(val)}%;background:${col}"></i>
        <div class="mev" style="left:${pct(m.mev)}%"></div>
        <div class="mrv" style="left:${pct(m.mrv)}%"></div>
      </div>
      <div class="tiny dim2" style="margin-top:3px">${verdict} · hit ${freq}× · min ${m.mev} / peak ${m.mav} / max ${m.mrv}</div>
    </div>`;
  };
  const trained=MORDER.filter(k=>done[k].sets>0);
  const under=MORDER.filter(k=>planned[k].sets>0&&planned[k].sets<M[k].mev);
  $('v-volume').innerHTML=`
    <div class="tabs">
      <button class="${volTab==='vol'?'on':''}" onclick="volTab='vol';render()">Last 7 days</button>
      <button class="${volTab==='plan'?'on':''}" onclick="volTab='plan';render()">Program plan</button>
    </div>
    ${volTab==='vol'?`
      <div class="card small dim">Sets counted per muscle over the past 7 days. A set of incline bench gives chest a full set, front delts half, triceps half — so these are what each muscle actually did, not which day it was on.</div>
      ${trained.length?trained.map(k=>bar(k,done[k].sets,done[k].freq,planned[k].sets)).join(''):
        '<div class="empty"><h3>No sets this week</h3><p class="small">Log a session and this fills in.</p></div>'}
      <div class="legend"><span><i style="background:var(--low)"></i>under minimum</span><span><i style="background:var(--pur)"></i>growth range</span><span><i style="background:var(--back)"></i>past the ceiling</span></div>
      <p class="tiny dim2 mt">Landmarks are population averages for trained lifters — a starting map, not a rule. If you're recovering fine and still adding reps at the top of your range, more is working for you.</p>
    `:`
      <div class="card small dim">What ${esc(S.program.name)} adds up to each week if you complete every session.</div>
      ${MORDER.filter(k=>planned[k].sets>0).map(k=>bar(k,planned[k].sets,planned[k].freq,planned[k].sets)).join('')}
      ${under.length?`<div class="card" style="border-color:var(--purDim)">
        <b class="small">Below the minimum</b>
        <div class="small dim" style="margin-top:6px">${under.map(k=>`${M[k].n} — about ${Math.ceil(M[k].mev-planned[k].sets)} more sets a week`).join('<br>')}</div>
      </div>`:''}`}`;
}

/* ---- progress ---- */
function renderProgress(){
  const el=$('v-progress');
  const used=[...new Set(S.history.flatMap(s=>s.ex.map(e=>e.exId)))];
  if(!used.length){el.innerHTML='<div class="empty"><h3>No history yet</h3><p class="small">Charts appear once you have logged the same lift twice.</p></div>';return;}
  if(!chartEx||!used.includes(chartEx))chartEx=used[0];
  const h=histFor(chartEx).slice().reverse();
  const pts=h.map(x=>({d:x.date,v:Math.round(e1rm(x.sets[0].w,x.sets[0].reps,x.sets[0].rir))}));
  const best=Math.max(...pts.map(p=>p.v)),first=pts[0].v,lastv=pts[pts.length-1].v;
  const gain=first>0?Math.round((lastv-first)/first*1000)/10:0;
  el.innerHTML=`
    <label class="f">Exercise</label>
    <select onchange="chartEx=this.value;render()">${used.map(id=>`<option value="${id}" ${id===chartEx?'selected':''}>${esc(exById(id)?.n||id)}</option>`).join('')}</select>
    <div class="card mt">
      <div class="between"><span class="small dim">Estimated 1RM</span>
        <span class="num" style="font-size:24px;font-weight:800">${lastv}<small style="font-size:14px;color:var(--dim)"> ${S.unit}</small></span></div>
      ${line(pts)}
      <div class="between tiny dim2" style="margin-top:6px"><span>${pts.length} sessions</span><span>best ${best}${S.unit} · ${gain>=0?'+':''}${gain}% since you started</span></div>
    </div>
    <div class="sect">Session by session</div>
    ${h.slice().reverse().map(x=>`<div class="card" style="padding:11px 13px">
      <div class="between small"><b>${fmtDate(x.date)}</b>
      <span class="num dim">${Math.round(e1rm(x.sets[0].w,x.sets[0].reps,x.sets[0].rir))}${S.unit} e1RM</span></div>
      <div class="tiny dim2" style="margin-top:3px">${x.sets.map(s=>`${s.w}${S.unit} × ${s.reps}${s.rir===0?' to failure':' @'+s.rir+' RIR'}`).join(' · ')}</div>
    </div>`).join('')}`;
}
function line(pts){
  if(pts.length<2)return '<p class="small dim mt">One session so far — the trend line needs two.</p>';
  const W=600,H=130,pad=6;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs)*.96,mx=Math.max(...vs)*1.04;
  const x=i=>pad+(i/(pts.length-1))*(W-pad*2);
  const y=v=>H-pad-((v-mn)/(mx-mn||1))*(H-pad*2);
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A970FF" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#A970FF" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${x(pts.length-1).toFixed(1)} ${H} L${pad} ${H} Z" fill="url(#g1)"/>
    <path d="${d}" fill="none" stroke="#C9A2FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="#08050C" stroke="#C9A2FF" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('')}
  </svg>`;
}

/* ---- sheet / toast / backup ---- */
function openSheet(html){$('panel').innerHTML=html;$('sheet').classList.add('on');}
function closeSheet(){$('sheet').classList.remove('on');}
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200);}
function exportData(){
  const json=JSON.stringify(S);
  openSheet(`<h2>Backup</h2><p class="small dim" style="margin-bottom:10px">Copy this somewhere safe, or save the file. Paste it back in on any device to restore.</p>
    <textarea rows="8" id="expt" style="font-size:11px">${esc(json)}</textarea>
    <div class="grid2 mt">
      <button class="btn sm" onclick="copyExp()">Copy</button>
      <a class="btn sm" style="text-decoration:none;text-align:center" download="plate-backup.json" href="data:application/json,${encodeURIComponent(json)}">Save file</a>
    </div>`);
}
function copyExp(){const t=$('expt');t.select();try{document.execCommand('copy');toast('Copied');}catch(e){toast('Select and copy manually');}}
function importData(){
  openSheet(`<h2>Restore a backup</h2><p class="small dim" style="margin-bottom:10px">Paste a backup below. This replaces your current program and history.</p>
    <textarea rows="8" id="impt" placeholder='{"unit":"kg",...}' style="font-size:11px"></textarea>
    <button class="btn pri wide mt" onclick="doImport()">Restore</button>`);
}
function doImport(){
  try{const o=JSON.parse($('impt').value);
    if(!o.program||!o.history)throw 0;
    S=o;S.planVer=S.planVer||PLAN_VER;S.session=null;save();closeSheet();render();toast('Backup restored');
  }catch(e){toast('That backup could not be read');}
}

const BAK=KEY+':bak';
function autoBackup(o){
  try{
    if(!o||!o.history||!o.history.length) return;
    localStorage.setItem(BAK,JSON.stringify({at:Date.now(),sessions:o.history.length,data:o}));
  }catch(e){}
}
function restoreAuto(){
  let b=null;
  try{b=JSON.parse(localStorage.getItem(BAK));}catch(e){}
  if(!b||!b.data) return toast('No auto-backup on this device yet');
  const when=new Date(b.at).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  if(!confirm('Roll back to the snapshot taken '+when+' ('+b.sessions+' sessions)? Anything logged since then is lost.')) return;
  S=normalize(b.data);S.planVer=S.planVer||PLAN_VER;S.session=null;save();render();toast('Auto-backup restored');
}
/* repair anything a half-written save or an older build left behind */
function normalize(o){
  o.history=Array.isArray(o.history)?o.history:[];
  o.history.forEach(h=>{
    if(!h.id) h.id=uid();
    if(!h.date) h.date=new Date().toISOString().slice(0,10);
    h.ex=(h.ex||[]).filter(e=>e&&Array.isArray(e.sets));
    h.ex.forEach(e=>{e.sets=e.sets.filter(Boolean).map(x=>({w:+x.w||0,reps:+x.reps||0,rir:+x.rir||0}))});
    h.ex=h.ex.filter(e=>e.sets.length);
  });
  o.history=o.history.filter(h=>h.ex.length);
  if(o.session&&!Array.isArray(o.session.ex)) o.session=null;
  if(o.session) o.session.ex=o.session.ex.filter(e=>e&&e.exId).map(e=>(Array.isArray(e.sets)?e:{...e,sets:[]}));
  if(o.program&&Array.isArray(o.program.days)) o.program.days.forEach(d=>{d.ex=(d.ex||[]).filter(c=>c&&exById(c.exId))});
  return o;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.v;render();window.scrollTo(0,0)});
function save(){DB.save(S);}
(async()=>{
  S=await DB.load();
  if(!S||!S.program||!S.program.days){S=seed();await DB.save(S);}
  else{
    autoBackup(S);S=normalize(S);
    if((S.planVer||1)<PLAN_VER){S.program=seed().program;S.planVer=PLAN_VER;await DB.save(S);}
  }
  render();
})();
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
