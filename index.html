<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taper">
<meta name="theme-color" content="#0a0f1c">
<title>Taper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#0a0f1c;--p1:#111a2c;--p2:#18233a;--line:#25314b;--bone:#ece5d6;--mu:#8e98af;--red:#ff4f5e;--red2:#ff98a0;--cy:#6fd3ff;--amb:#ffc260;--ok:#7ee0b0;
--f:'Archivo',-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--bone);font:16px/1.45 var(--f)}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.wide{font-stretch:125%;font-weight:800;letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:20;background:rgba(10,15,28,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:9px;font-size:24px}
.mark svg{width:26px;height:26px}
.pill{font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--p2);border:1px solid var(--line);color:var(--bone);white-space:nowrap}
.pill.amb{color:var(--amb);border-color:#5b4416;background:#22190a}
main{max-width:620px;margin:0 auto;padding:14px 14px 0}
h1{font-size:30px;line-height:1.05;margin:8px 2px 6px}
h2{font-size:21px;line-height:1.1;margin:0}
.sub{color:var(--mu);font-size:15px;margin:0 2px 14px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.hero{border-radius:20px;padding:18px;background:linear-gradient(160deg,#1b2540,#111a2c 60%);border-color:#2f3d5e}
.muted{color:var(--mu)}.small{font-size:13.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:700;font-size:18px;font-stretch:112%}
.btn.sec{background:var(--p2);border:1px solid var(--line);color:var(--bone)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mu);font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 14px}
.week div{text-align:center;font-size:12px;color:var(--mu)}
.week i{display:block;width:30px;height:30px;margin:4px auto 0;border-radius:50%;border:1.5px solid var(--line)}
.week i.on{background:var(--red);border-color:var(--red)}.week i.today{border-color:var(--bone)}
.exli{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.exli:first-child{border-top:0}
.exli b{font-weight:600;flex:1}
.mtag{font-size:12px;color:var(--red2);white-space:nowrap}
.daybtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.daybtn b{display:block;font-size:17px;font-stretch:112%}
.banner{border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:12px;background:#22190a;border:1px solid #5b4416;color:var(--amb)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,15,28,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mu);font-size:12.5px;font-weight:600;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--bone)}nav button.on svg{stroke:var(--red)}
body.insession nav{display:none}
/* session */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--p1);font-weight:700;font-size:15px;color:var(--mu)}
.chip.done{background:#3a1a22;border-color:#7a2a37;color:var(--red2)}
.chip.on{border-color:var(--bone);color:var(--bone);background:var(--p2)}
.stage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#16223b,#0c1324 75%);border:1px solid var(--line)}
.stage svg.fig{display:block;width:100%;height:auto}
.stage .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(111,211,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(111,211,255,.05) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.stage .ph{position:absolute;left:8px;bottom:8px;right:8px;pointer-events:none}
.stage .hint{position:absolute;top:8px;right:8px;pointer-events:none}
.ph .lab{display:inline-block;font-size:12.5px;font-weight:700;background:rgba(10,15,28,.8);padding:5px 9px;border-radius:8px;color:var(--bone)}
.ph .lab span{color:var(--red2);font-weight:600}
.hint{font-size:12px;color:var(--mu);background:rgba(10,15,28,.8);padding:5px 8px;border-radius:8px}
.tgt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.tag{font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:7px;background:var(--p2);color:var(--bone)}
.tag.up{background:#0f2e2a;color:var(--ok)}.tag.down,.tag.stall{background:#3a1a22;color:var(--red2)}.tag.hold,.tag.deload{background:#22190a;color:var(--amb)}.tag.new{background:#10283a;color:var(--cy)}
.big{font-size:30px;font-weight:800;font-stretch:118%;letter-spacing:-.01em}
.big em{font-style:normal;color:var(--mu);font-weight:500;font-size:18px}
.note{font-size:14.5px;color:#cfd5e3;margin:6px 0}
.sets{margin:10px 0 4px}
.set{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:none;border:1px solid transparent;margin-bottom:4px}
.set .n{font-size:13px;color:var(--mu);font-weight:600}
.set .v{font-weight:700;font-size:17px;font-stretch:110%}
.set .s{font-size:13px;color:var(--mu)}
.set.done .v{color:var(--bone)}.set.done .s{color:var(--red2)}
.set.plan .v{color:var(--mu);font-weight:600}
.set.sel{border-color:var(--bone);background:var(--p2)}
.logger{background:var(--p2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.stp{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;margin-bottom:10px}
.stp button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--p1);font-size:26px;font-weight:600}
.stp button:active{background:var(--line)}
.stp label{display:block;text-align:center}
.stp input{width:100%;text-align:center;background:none;border:0;font-size:34px;font-weight:800;font-stretch:118%;padding:0}
.stp small{display:block;font-size:12px;color:var(--mu);margin-top:-2px}
.rir{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.rir button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--p1);font-weight:700;font-size:15px;color:var(--mu)}
.rir button.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.rirl{font-size:12.5px;color:var(--mu);margin:0 2px 6px}
.tog{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--mu);margin:4px 2px 10px}
.tog input{width:22px;height:22px;accent-color:var(--red)}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
/* rest */
#rest{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;display:none;align-items:center;gap:12px;background:#17213a;border:1px solid #33456e;border-radius:18px;padding:10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#rest.on{display:flex}
#rest svg{width:62px;height:62px;flex:none}
#rest .t{font-size:24px;font-weight:800;font-stretch:118%}
#rest .l{font-size:13px;color:var(--mu);line-height:1.3}
#rest .b{display:flex;gap:6px;margin-left:auto}
#rest .b button{background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:700;font-size:14px}
#rest.end{border-color:var(--ok)}#rest.end .t{color:var(--ok)}
body.insession{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet.on{display:block}
#sheet .in{max-width:620px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px))}
.ctrl{display:flex;gap:6px;margin:10px 0}
.ctrl button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--p1);font-weight:600;font-size:14px}
.ctrl button.on{background:var(--p2);border-color:var(--bone)}
.mus{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mus span{font-size:12.5px;padding:4px 9px;border-radius:99px;border:1px solid #7a2a37;color:var(--red2);background:#2a1219}
.mus span.h{border-color:var(--line);color:var(--mu);background:none}
.sec{margin-top:18px}
.sec h3{font-size:15px;font-stretch:115%;margin:0 0 8px;color:var(--bone)}
.sec p{margin:0;color:#cfd5e3;font-size:15px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 10px 34px;font-size:15px;color:#cfd5e3}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:50%;background:var(--p2);border:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--bone)}
.cue{display:grid;grid-template-columns:70px 1fr;gap:10px;font-size:15px;padding:8px 0;border-top:1px solid var(--line);color:#cfd5e3}
.cue b{color:var(--red2);font-size:13px;font-weight:700}
.avoid{border-left:3px solid var(--amb);padding:8px 12px;background:#1a160d;border-radius:0 10px 10px 0;font-size:15px;color:#e9dcc0}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;font-size:15px}
.opt input{accent-color:var(--red);width:19px;height:19px}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.fld:first-child{border-top:0}
.fld input,.fld select{width:130px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--ink);padding:0 10px;font-size:16px;color:var(--bone)}
.yt{display:block;text-align:center;padding:13px;border-radius:12px;border:1px solid var(--line);color:var(--cy);text-decoration:none;font-weight:600;margin-top:16px}
.back{background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
/* stats */
.vrow{margin-bottom:13px}
.vl{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;margin-bottom:5px}
.vl span{color:var(--mu);font-size:12.5px;text-align:right}
.bar{position:relative;height:10px;border-radius:5px;background:var(--ink);border:1px solid var(--line);overflow:hidden}
.bar .bd{position:absolute;top:0;bottom:0;background:#22304d}
.bar .dn{position:absolute;top:0;bottom:0;left:0;background:var(--red);border-radius:5px}
.bar .pl{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bone)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:300px;margin:0 auto}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--p2);display:block}
.heat i.on{background:var(--red)}.heat i.dl{background:var(--amb)}.heat i.fut{background:none;border:1px dashed var(--line)}
.lift{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left}
.lift:first-child{border-top:0}
.lift b{flex:1;font-weight:600;font-size:15px}
.lift .v{font-weight:800;font-stretch:115%;font-size:18px;text-align:right;min-width:56px}
.dp{color:var(--ok)}.dn2{color:var(--red2)}
.hist{font-size:13.5px;color:var(--mu);padding:0 0 10px}
.hist div{padding:4px 0}
.lib{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.lib:first-child{border-top:0}
.lib .th{width:64px;height:48px;border-radius:9px;background:#0c1324;border:1px solid var(--line);flex:none;overflow:hidden}
.lib .th svg{width:100%;height:100%}
.lib b{display:block;font-weight:600;font-size:15px}
.lib small{color:var(--mu);font-size:12.5px}
.grp{font-size:15px;font-stretch:115%;font-weight:700;margin:20px 2px 8px}
.refs p{font-size:13.5px;color:var(--mu);margin:6px 0}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--bone);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;display:none;max-width:90%;text-align:center}
.sumk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sumk div{background:var(--p2);border-radius:12px;padding:12px;text-align:center}
.sumk b{display:block;font-size:26px;font-weight:800;font-stretch:118%}
.sumk span{font-size:12.5px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){.chip,.set{transition:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<nav id="nav">
<button data-go="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 12h3l2-5 4 10 2-5h5"/></svg>Today</button>
<button data-go="library"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v7M7 10l5 2 5-2M9 21l3-6 3 6"/></svg>Form</button>
<button data-go="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Stats</button>
<button data-go="setup"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
</nav>
<div id="rest" role="timer"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="26" fill="none" stroke="#25314b" stroke-width="5"/><circle id="ring" cx="31" cy="31" r="26" fill="none" stroke="#ff4f5e" stroke-width="5" stroke-linecap="round" transform="rotate(-90 31 31)" stroke-dasharray="163.4" stroke-dashoffset="0"/></svg>
<div><div class="t" id="rt">0:00</div><div class="l" id="rl"></div></div>
<div class="b"><button data-r="-15">−15</button><button data-r="30">+30</button><button data-r="skip">Skip</button></div></div>
<div id="sheet"><div class="in" id="sin"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   1. MUSCLES & EXERCISES
   ===================================================================== */
const M={
 upperChest:['Upper chest',8,14,'p'],chest:['Chest (total)',10,16,'p'],lats:['Lats',12,20,'p'],sideDelts:['Side delts',12,22,'p'],
 biceps:['Biceps',10,18,'p'],triceps:['Triceps',10,16,'p'],brachio:['Brachialis + brachioradialis',10,18,'p'],forearmExt:['Forearm extensors',6,12,'p'],
 upperBack:['Upper back',8,14,'s'],rearDelts:['Rear delts',6,12,'s'],forearmFlex:['Forearm flexors',3,8,'s'],abs:['Abs',6,10,'s'],
 frontDelts:['Front delts',0,8,'i'],quads:['Quads',3,8,'m'],hams:['Hamstrings',3,8,'m'],calves:['Calves',3,8,'m']};
const GRP={p:'Priority',s:'Support',i:'Indirect only',m:'Maintenance'};
const REGION={upperChest:'Chest',chest:'Chest',lats:'Back',upperBack:'Back',sideDelts:'Shoulders',rearDelts:'Shoulders',frontDelts:'Shoulders',biceps:'Arms',triceps:'Arms',brachio:'Arms',forearmExt:'Forearms',forearmFlex:'Forearms',abs:'Abs',quads:'Legs',hams:'Legs',calves:'Legs'};

const EX={
incSmith:{n:'Incline Smith press (30°)',t:'c',inc:2.5,m:{upperChest:1,chest:1,frontDelts:.5,triceps:.5},
 why:'Main upper-chest builder. A ~30° incline shifts work to the clavicular head, and the fixed rail means loose shoulders aren’t fighting to stabilise.',
 setup:['Set the bench to ~30° (2nd–3rd notch), centred under the bar.','Lie back so the bar comes down just below your collarbones.','Feet flat, shoulder blades pinned back and down before you unrack.'],
 cues:['Press up, keep the blades pinned','2–3 s down to the upper chest, light touch'],avoid:'Bouncing off the chest, or letting your shoulders roll forward at the top.'},
incDB:{n:'Incline DB press (30°)',t:'c',inc:2,m:{upperChest:1,chest:1,frontDelts:.5,triceps:.5},
 why:'Second upper-chest hit with a deeper stretch than a bar allows. Dumbbells let each shoulder find its own comfortable path.',
 setup:['Bench at ~30°. Sit with the DBs on your knees.','Lie back and kick them up one at a time to over your upper chest.'],
 cues:['Press up and slightly in','Lower beside the upper chest, elbows ~45°'],avoid:'Letting the shoulders roll forward off the bench at the bottom.'},
pulldown:{n:'Lat pulldown',t:'c',inc:2.5,m:{lats:1,upperBack:.5,biceps:.5,brachio:.5},
 why:'Main lat-width builder. Grip width barely changes how hard the lats work, so pick the width that gives the longest stretch and a full pull.',
 setup:['Knee pad snug on your thighs.','Grip about 1.3× shoulder width.','Sit tall with a slight lean back.'],
 cues:['Drive the elbows down to your sides','Let the arms reach all the way up — feel the lats stretch'],avoid:'Swinging your torso, or cutting the top stretch short.'},
neutralPulldown:{base:'pulldown',n:'Neutral-grip pulldown',setup:['Wide neutral handle, knee pad snug.','Full reach at the top, elbows down and slightly back to your ribs.']},
saPulldown:{n:'Single-arm cable pulldown',t:'c',inc:2.5,m:{lats:1,biceps:.5,brachio:.5},
 why:'One arm at a time lets you reach higher for a bigger lat stretch and pull in line with the fibres. More lat, less biceps per set.',
 setup:['One D-handle on the pulldown, knee pad snug.','Sit a little to the side so the cable runs straight down to your hand.'],
 cues:['Drive the elbow down to your back pocket','Reach fully up and slightly across'],avoid:'Turning it into a biceps curl — the elbow leads, not the hand.'},
smithFlat:{n:'Flat Smith press',t:'c',inc:2.5,m:{chest:1,frontDelts:.5,triceps:.5},
 why:'Whole-chest volume on a fixed path, so loose shoulders don’t have to stabilise. Keeps overall chest thickness growing under the upper chest.',
 setup:['Flat bench centred so the bar lands on mid-chest.','Blades back and down, feet planted.'],
 cues:['Press, elbows ~45–60° from your sides','2–3 s down to mid-chest'],avoid:'Flaring the elbows to 90° — the position that irritates loose shoulders.'},
flatDB:{base:'smithFlat',n:'Flat DB press',inc:2,setup:['Blades back, elbows ~45–60°.','Lower to a deep but comfortable stretch, press up and slightly in.']},
cableRowWide:{n:'Seated cable row (wide bar)',t:'c',inc:2.5,m:{upperBack:1,rearDelts:.5,lats:.5,biceps:.5,brachio:.5},
 why:'Upper-back detail — mid traps, rhomboids and rear delts — fills in the back between the lats so it looks complete.',
 setup:['Clip a wide bar onto the low cable row.','Feet on the plate, knees soft, sit tall.'],
 cues:['Pull to the lower chest, elbows out, squeeze the blades','Reach forward and let the upper back stretch'],avoid:'Rocking your whole torso back to move the weight.'},
dbRowWide:{base:'cableRowWide',n:'Single-arm DB row (elbow out)',inc:2,setup:['Hand and knee on a bench.','Row toward your lower chest with the elbow flared ~60°.']},
latRow:{n:'Single-arm cable row (to hip)',t:'c',inc:2.5,m:{lats:1,upperBack:.5,biceps:.5,brachio:.5},
 why:'Elbow tucked and pulling toward the hip is the lats’ other main job. With pulldowns, the lats get trained through both of their functions.',
 setup:['Single handle on a low pulley.','Sit tall, arm reaching forward, opposite hand braced.'],

/* =====================================================================
   3. FIGURE RIG & ANIMATION
   ===================================================================== */
const L={T1:30,T2:32,UA:34,FA:30,TH:44,SH:42,FT:14};
const R2D=180/Math.PI;
const dv=a=>[Math.sin(a/R2D),Math.cos(a/R2D)];
const antL=a=>[Math.cos(a/R2D),-Math.sin(a/R2D)];
const antT=a=>[-Math.cos(a/R2D),Math.sin(a/R2D)];
const add=(p,v,k=1)=>[p[0]+v[0]*k,p[1]+v[1]*k];
const ang=(p,q)=>Math.atan2(q[0]-p[0],q[1]-p[1])*R2D;
function ik(P0,T,L1,L2,sg){const D0=Math.hypot(T[0]-P0[0],T[1]-P0[1]);const D=Math.max(Math.abs(L1-L2)+.5,Math.min(D0,L1+L2-.3));const b=ang(P0,T);const c=(L1*L1+D*D-L2*L2)/(2*L1*D);const A=Math.acos(Math.max(-1,Math.min(1,c)))*R2D;const a1=b+sg*A;const E=add(P0,dv(a1),L1);return[a1,ang(E,T)];}

function fk(P,view){
 const tl=P.tls??1,H=[P.hx,P.hy],Mi=add(H,dv(P.t1),L.T1*tl),S=add(Mi,dv(P.t2),L.T2*tl);
 const J={H,M:Mi,S,P};
 J.head=add(S,dv(P.t2),P.hdl??19);
 const us=P.uas??1,fs=P.fas??1,ts=P.ths??1;
 if(view==='side'){
  if(P.Rt){P.Tn=add(add(S,dv(P.t2),P.Rt[0]),antT(P.t2),P.Rt[1]);}
  if(P.Tn){const a=ik(S,P.Tn,L.UA*us,L.FA*fs,P.sg??1);P.ua=a[0];P.fa=a[1];}
  if(P.Ta){const a=ik(H,P.Ta,L.TH*ts,L.SH,P.sgL??1);P.th=a[0];P.sh=a[1];}
  J.En=add(S,dv(P.ua),L.UA*us);J.Wn=add(J.En,dv(P.fa),L.FA*fs);
  J.Ef=add(S,dv(P.ua2??P.ua),L.UA*us);J.Wf=add(J.Ef,dv(P.fa2??P.fa),L.FA*fs);
  J.Kn=add(H,dv(P.th),L.TH*ts);J.An=add(J.Kn,dv(P.sh),L.SH);J.Tn_=add(J.An,dv(P.ft??90),L.FT);
  const th2=P.th2??P.th,sh2=P.sh2??P.sh;J.Kf=add(H,dv(th2),L.TH*ts);J.Af=add(J.Kf,dv(sh2),L.SH);J.Tf=add(J.Af,dv(P.ft2??P.ft??90),L.FT);
 }else{
  const r=antT(P.t2),rh=antT(P.t1);
  J.SR=add(S,r,20);J.SL=add(S,r,-20);J.HR=add(H,rh,9);J.HL=add(H,rh,-9);
  if(P.Tr){const a=ik(J.SR,P.Tr,L.UA*us,L.FA*fs,P.sg??1);P.ua=a[0];P.fa=a[1];
   if(P.ual==null&&!P.Tl){const m=[2*S[0]-P.Tr[0],P.Tr[1]];const b=ik(J.SL,m,L.UA*us,L.FA*fs,-(P.sg??1));P._ual=b[0];P._fal=b[1];}}
  if(P.Tl){const b=ik(J.SL,P.Tl,L.UA*us,L.FA*fs,P.sgl??-1);P._ual=b[0];P._fal=b[1];}
  const ual=P._ual??P.ual??-P.ua,fal=P._fal??P.fal??-P.fa;
  J.ER=add(J.SR,dv(P.ua),L.UA*us);J.WR=add(J.ER,dv(P.fa),L.FA*fs);
  J.EL=add(J.SL,dv(ual),L.UA*us);J.WL=add(J.EL,dv(fal),L.FA*fs);
  J.KR=add(J.HR,dv(P.th),L.TH*ts);J.AR=add(J.KR,dv(P.sh),L.SH);
  J.KL=add(J.HL,dv(P.thl??-P.th),L.TH*ts);J.AL=add(J.KL,dv(P.shl??-P.sh),L.SH);
 }
 return J;
}

const BODY='#ddd4c3',FAR='#7a7366',STEEL='#4f5d7c',PAD='#2c3a58',PADL='#3a4a6e',CAB='#9fb2d6';
const f1=n=>Math.round(n*10)/10;
const ln=(a,b,w,c,o='')=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${o}/>`;
const cir=(p,r,f,o='')=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${f}" ${o}/>`;
const G=()=>`<line x1="0" y1="222" x2="320" y2="222" stroke="#2a3756" stroke-width="2"/>`;
const pad=(a,b,w=12)=>ln(a,b,w,PAD)+ln(a,b,w-6,PADL);
const leg=(a,c='#3a4766')=>ln(a,[a[0],222],4,c);
const plate=(p,r)=>cir(p,r,'#1d2740',`stroke="${STEEL}" stroke-width="2.5"`)+cir(p,3,STEEL);
const dbS=p=>cir(p,7,'#1d2740',`stroke="#6c7ba0" stroke-width="2.2"`)+cir(p,2.5,'#6c7ba0');
function dbRod(p,a){const v=dv(a);const e1=add(p,v,10),e2=add(p,v,-10);return ln(e1,e2,3,'#6c7ba0')+ln(add(e1,v,-1),add(e1,v,3),10,'#2b3858')+ln(add(e2,v,1),add(e2,v,-3),10,'#2b3858');}
const cable=(a,p)=>ln(a,p,1.5,CAB,'stroke-dasharray="0"')+cir(a,5,'#1d2740',`stroke="${STEEL}" stroke-width="2"`);
function stack(x,y1){let s=`<rect x="${x}" y="${y1}" width="26" height="${222-y1}" rx="3" fill="#121b30" stroke="#2a3756"/>`;for(let i=0;i<6;i++)s+=`<rect x="${x+4}" y="${190-i*7}" width="18" height="5" rx="1" fill="#2b3858"/>`;return s;}
const rail=x=>ln([x,24],[x,222],3,'#2e3a58')+ln([x-8,24],[x+8,24],4,'#2e3a58');

function muscleSvg(J,view,key,lvl,u,side){
 const P=J.P,op=(lvl>=1?.55+.45*u:.35+.2*u).toFixed(2),fill=lvl>=1?'#ff4f5e':'#ff98a0';
 const el=(p0,p1,t,off,rx,ry,perp)=>{const c=[p0[0]+(p1[0]-p0[0])*t+perp[0]*off,p0[1]+(p1[1]-p0[1])*t+perp[1]*off];const a=Math.atan2(p1[1]-p0[1],p1[0]-p0[0])*R2D;return`<ellipse cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${rx}" ry="${ry}" transform="rotate(${f1(a)} ${f1(c[0])} ${f1(c[1])})" fill="${fill}" opacity="${op}"/>`;};
 if(view==='side'){
  const S=J.S,E=J.En,W=J.Wn,ua=P.ua,fa=P.fa,tA=antT(P.t2),tL=antT(P.t1),aU=antL(ua),aF=antL(fa),Lu=L.UA*(P.uas??1);
  switch(key){
   case'biceps':return el(S,E,.58,3.6,Lu*.3,4.6,aU);
   case'triceps':return el(S,E,.55,-3.8,Lu*.33,4.8,aU);
   case'brachio':return el(E,W,.28,2.6,7.5,4,aF)+el(S,E,.82,1.5,4.5,3.4,aU);
   case'forearmFlex':return el(E,W,.42,2.6,8,3.6,aF);
   case'forearmExt':return el(E,W,.42,-2.6,8,3.6,aF);
   case'frontDelts':return el(S,E,.12,3.4,6.5,5.5,aU);
   case'sideDelts':return el(S,E,.08,0,7.5,7,aU);
   case'rearDelts':return el(S,E,.12,-3.4,6.5,5.5,aU);
   case'chest':return el(J.M,S,.5,10,11,5.5,tA);
   case'upperChest':return el(J.M,S,.86,9.5,8,4.6,tA);
   case'abs':return el(J.H,J.M,.5,10,10,4.5,tL)+el(J.M,S,.18,10.5,6,4.2,tA);
   case'lats':return el(J.M,S,.42,-10,14,6,tA);
   case'upperBack':return el(J.M,S,.86,-10,9,5,tA);
   case'quads':return el(J.H,J.Kn,.5,4.6,15,5,antL(P.th));
   case'hams':return el(J.H,J.Kn,.5,-4.6,15,5,antL(P.th));
   case'calves':return el(J.Kn,J.An,.3,-3.8,10,4.5,antL(P.sh));
  }
  return'';
 }
 // front view

 at(t){const T=this.tempo(),tot=T.c+T.ht+T.e+T.hb;let x=(t%tot+tot)%tot;
  if(x<T.c)return[ease(x/T.c),0];x-=T.c;if(x<T.ht)return[1,1];x-=T.ht;if(x<T.e)return[1-ease(x/T.e),2];return[0,3];}
 loop(now){if(!this.host.isConnected){cancelAnimationFrame(this.raf);return;}
  this.raf=requestAnimationFrame(this.loop);if(now-this.last<28)return;this.last=now;
  const t=this.play?(now-this.t0)/1000*this.speed:this.frozenT;if(this.play)this.frozenT=t;
  const[u,ph]=this.at(t);this.draw(u);
  if(this.lab&&this.ph!==ph){this.ph=ph;const c=this.x.cues||['',''];this.lab.innerHTML=PHASES[ph]+(ph===0&&c[0]?` <span>· ${c[0]}</span>`:ph===2&&c[1]?` <span>· ${c[1]}</span>`:'');}}
 draw(u){this.g.innerHTML=frameSvg(this.key,this.x.m,u,this.hl).replace(/url\(#gl\)/g,`url(#${this.id})`);}
 toggle(){if(this.play){this.play=false;}else{this.t0=performance.now()-this.frozenT/this.speed*1000;this.play=true;}}
 setSpeed(s){const t=this.frozenT;this.speed=s;this.t0=performance.now()-t/s*1000;}

}
function thumbSvg(exId){const x=ex(exId);return`<svg viewBox="${fitBox(x.an)}">${frameSvg(x.an,x.m,.55,true).replace(/url\(#gl\)/g,'none')}</svg>`;}

const KEY='taper.v1';
function iso(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fresh(){return{v:1,start:iso(),meso:6,forceDeload:false,swaps:{},inc:{},log:[],cur:null};}

const $=s=>document.querySelector(s);

const rnd=(x,st)=>Math.max(st,Math.round(Math.round(x/st)*st*100)/100);
const e1=(w,r,rir)=>w*(1+(r+(+rir||0))/30);
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const dstr=d=>new Date(d+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
const day=id=>DAYS.find(d=>d.id===id);
const curEx=(did,i)=>{const s=day(did).slots[i],w=S.swaps[did+':'+i];return w&&EX[w]&&(w===s.ex||s.alts.includes(w))?w:s.ex;};
const incOf=id=>S.inc[id]??ex(id).inc;
const effort=r=>r===0?'last set to failure OK':'stop '+r+' rep'+(r>1?'s':'')+' short';
const short=n=>n.split(' (')[0];

function weekInfo(){const a=new Date(S.start+'T00:00'),b=new Date(iso()+'T00:00');const w=Math.floor((b-a)/(7*864e5));const wk=((w%S.meso)+S.meso)%S.meso+1;return{wk,deload:S.forceDeload||wk===S.meso};}
function monday(off=0){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d;}

/* =====================================================================
   5. PROGRESSION ENGINE
   ===================================================================== */
function hist(id,k){const out=[];for(let i=S.log.length-1;i>=0&&out.length<k;i--){const Lg=S.log[i];if(Lg.deload)continue;const e=Lg.entries.find(x=>x.ex===id&&x.sets.length);if(e)out.push({date:Lg.date,sets:e.sets,form:e.form});}return out;}
function bestEver(id){let b=0;S.log.forEach(Lg=>Lg.entries.forEach(e=>{if(e.ex===id)e.sets.forEach(s=>{b=Math.max(b,e1(s.w,s.r,s.rir));});}));return b;}
function suggest(slot,id,deload){
 const lo=slot.lo,hi=slot.hi,tR=slot.rir,st=incOf(id);
 const n=deload?Math.max(1,Math.ceil(slot.sets/2)):slot.sets;
 const fill=v=>Array(n).fill(v);const h=hist(id,3);
 if(!h.length)return{n,w:null,reps:fill(hi),rir:deload?3:tR,tag:'new',last:'',note:'First time: pick a weight you could lift about '+hi+' times, '+(tR?tR+' rep'+(tR>1?'s':'')+' short of failure':'close to failure')+'. Log it honestly and Taper sets every target from here.'};
 const Lg=h[0],ls=Lg.sets,w=ls[0].w,per=i=>ls[Math.min(i,ls.length-1)];
 const last=ls.map(s=>fmt(s.w)+'×'+s.r).join('  ');
 if(deload)return{n,w,reps:fill(lo),rir:3,tag:'deload',last,note:'Deload: same weight, half the sets, stop ~3 reps short. Fatigue drops so last block’s growth can show.'};
 let out;
 if(Lg.form===false)out={w,reps:Array.from({length:n},(_,i)=>per(i).r),tag:'hold',note:'Form slipped last time, so the load stays. Same weight and reps — make every rep clean.'};
 else if(ls.length>=slot.sets&&ls.every(s=>s.r>=hi)){
  const nw=rnd(w+st,st),f=ls[0],est=e1(f.w,f.r,f.rir??tR),pr=Math.floor(30*(est/nw-1)-tR);
  if(pr>=lo-1){const r0=Math.max(lo,Math.min(hi,pr));out={w:nw,reps:Array.from({length:n},(_,i)=>Math.max(lo-1,r0-(f.r-per(i).r))),tag:'up',note:'Every set hit '+hi+'+ → +'+fmt(st)+' kg. Reps reset lower; build back up to '+hi+'.'};}
  else out={w,reps:Array.from({length:n},(_,i)=>per(i).r+1),tag:'reps',note:'+'+fmt(st)+' kg is a big jump here, so earn it with reps past '+hi+' first. Weight goes up once you’d still get '+(lo-1)+'+ reps heavier. (Smaller plates? Change the step in the form view.)'};
 }else if(ls[0].r<lo-1&&(ls[0].rir??tR)<=tR&&w>st){const nw=Math.min(rnd(w*.9,st),rnd(w-st,st));out={w:nw,reps:fill(lo+1),tag:'down',note:'Last time fell below '+lo+' reps — drop to '+fmt(nw)+' kg and own the full range.'};}
 else out={w,reps:Array.from({length:n},(_,i)=>{const s=per(i);const x=(s.rir!=null&&s.rir>tR+1)?(s.rir-tR):1;return Math.min(hi,s.r+x);}),tag:'reps',note:'Same weight — beat last time by a rep per set. Hit '+hi+' on every set and the weight goes up.'};
 if(h.length>=3&&out.tag!=='hold'){const b=h.map(x=>Math.max(...x.sets.map(s=>e1(s.w,s.r,s.rir))));if(b[0]<=b[1]*1.005&&b[1]<=b[2]*1.005){out.tag='stall';out.note='Flat for 3 sessions. Sleep and food first; if it’s still flat next time, swap to an alternative or deload early. '+out.note;}}
 return{n,...out,rir:tR,last};
}
const TAGS={new:'First session',up:'Add weight',reps:'Add reps',hold:'Hold',down:'Drop weight',stall:'Stalled',deload:'Deload'};
function stalls(){const seen=new Set();let c=0;DAYS.forEach(d=>d.slots.forEach((s,i)=>{const id=curEx(d.id,i);if(seen.has(id))return;seen.add(id);const h=hist(id,3);if(h.length<3)return;const b=h.map(x=>Math.max(...x.sets.map(s=>e1(s.w,s.r,s.rir))));if(b[0]<=b[1]*1.005&&b[1]<=b[2]*1.005)c++;}));return c;}

/* =====================================================================
   6. SESSION
   ===================================================================== */
function mkEntry(did,i,dl){const s=day(did).slots[i],id=curEx(did,i),sg=suggest(s,id,dl);const e={ex:id,slot:i,form:true,sg,sets:Array.from({length:sg.n},(_,k)=>({w:sg.w,r:sg.reps[k],rir:sg.rir,done:false})),sel:0};e.p={w:sg.w??0,r:sg.reps[0],rir:sg.rir};return e;}
function startDay(did){const dl=weekInfo().deload;S.cur={day:did,date:iso(),started:Date.now(),deload:dl,i:0,entries:day(did).slots.map((_,i)=>mkEntry(did,i,dl)),rest:null};save();wake(true);go('session');}
function nextDay(){if(!S.log.length)return'd1';const i=DAYS.findIndex(d=>d.id===S.log[S.log.length-1].day);return DAYS[(i+1)%DAYS.length].id;}
function selectSet(e,k){e.sel=k;const s=e.sets[k];if(s.done)e.p={w:s.w,r:s.r,rir:s.rir};else{const prev=[...e.sets].slice(0,k).reverse().find(x=>x.done);e.p={w:prev?prev.w:(e.sg.w??e.p?.w??0),r:e.sg.reps[Math.min(k,e.sg.reps.length-1)]??e.sg.reps[0],rir:e.sg.rir};}}
function logSet(){
 const C=S.cur,e=C.entries[C.i],k=e.sel;if(k<0||k>=e.sets.length)return;
 const p=e.p;if(!(p.w>=0)||!(p.r>0)){toast('Set the reps first');return;}
 const was=e.sets[k].done;e.sets[k]={w:+p.w,r:+p.r,rir:+p.rir,done:true};e.sets.forEach(x=>{if(!x.done&&x.w==null)x.w=+p.w;});
 const nx=e.sets.findIndex(s=>!s.done);
 if(nx>-1){e.sel=nx;e.p={w:+p.w,r:e.sg.reps[Math.min(nx,e.sg.reps.length-1)],rir:e.sg.rir};}else e.sel=-1;
 save();
 if(!was){const sl=day(C.day).slots[e.slot];let sec=sl.rest,lab;
  const pi=sl.ss?day(C.day).slots.findIndex((o,j)=>j!==e.slot&&o.ss===sl.ss):-1;
  if(pi>e.slot&&C.entries[pi].sets.some(s=>!s.done)){sec=20;lab='Superset → '+short(ex(C.entries[pi].ex).n);}
  else if(nx>-1)lab='Next: set '+(nx+1)+' · '+fmt(e.p.w)+' kg × '+e.p.r;
  else{const n2=C.entries.findIndex((x,j)=>j>C.i&&x.sets.some(s=>!s.done));lab=n2>-1?'Next: '+short(ex(C.entries[n2].ex).n):'Last set done — finish up';}
  startRest(sec,lab);
  if(pi>e.slot&&C.entries[pi].sets.some(s=>!s.done)){C.i=pi;save();}
  else if(pi>-1&&pi<e.slot&&C.entries[pi].sets.some(s=>!s.done)){C.i=pi;save();}
 }
 render();
}
function finish(){
 const C=S.cur;const entries=C.entries.map(e=>({ex:e.ex,slot:e.slot,form:e.form,sets:e.sets.filter(s=>s.done).map(s=>({w:s.w,r:s.r,rir:s.rir}))})).filter(e=>e.sets.length);
 if(!entries.length){if(confirm('Nothing logged yet. Discard this session?')){S.cur=null;save();stopRest();wake(false);go('today');}return;}
 let prs=0,vol=0,sets=0;entries.forEach(e=>{const p=bestEver(e.ex),now=Math.max(...e.sets.map(s=>e1(s.w,s.r,s.rir)));if(p&&now>p*1.001)prs++;e.sets.forEach(s=>{vol+=s.w*s.r;sets++;});});
 const mins=Math.round((Date.now()-C.started)/60000);
 S.log.push({id:Date.now(),date:C.date,day:C.day,deload:C.deload,mins,entries});S.cur=null;save();stopRest();wake(false);
 SUMMARY={day:C.day,prs,vol,sets,mins};go('today');
}

 h+=`<div class="nav2"><button class="btn ghost" data-a="addset">+ Add set</button><button class="btn ghost" data-a="swapq" data-d="${C.day}" data-k="${e.slot}">Swap exercise</button></div>`;
 return h;
}

 const groups={};Object.keys(used).forEach(id=>{const x=ex(id);const k=Object.keys(x.m).find(m=>x.m[m]===1);(groups[REGION[k]]=groups[REGION[k]]||[]).push(id);});
 let h=`<h1 class="wide">Form library</h1><p class="sub">Every exercise in your programme. Tap one to watch it animated with the working muscles lit up.</p>`;
 for(const g of['Chest','Back','Shoulders','Arms','Forearms','Abs','Legs']){if(!groups[g])continue;
  h+=`<div class="grp">${g}</div><div class="card">${groups[g].map(id=>{const x=ex(id);return`<button class="lib" data-a="form" data-x="${id}"><span class="th">${thumbSvg(id)}</span><span><b>${x.n}</b><small>${used[id].filter((v,i,a)=>a.indexOf(v)===i).join(', ')}</small></span></button>`;}).join('')}</div>`;}

function planned(){const v={};DAYS.forEach(d=>d.slots.forEach((s,i)=>{const m=ex(curEx(d.id,i)).m;for(const k in m)v[k]=(v[k]||0)+m[k]*s.sets;}));return v;}
function doneWeek(){const v={},mon=iso(monday());const add2=(id,n)=>{const m=ex(id).m;for(const k in m)v[k]=(v[k]||0)+m[k]*n;};S.log.filter(Lg=>Lg.date>=mon).forEach(Lg=>Lg.entries.forEach(e=>add2(e.ex,e.sets.length)));if(S.cur)S.cur.entries.forEach(e=>add2(e.ex,e.sets.filter(s=>s.done).length));return v;}
function spark(vals){if(vals.length<2)return'<svg width="90" height="28"></svg>';const W=90,H=28,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="#ff4f5e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${vals.map((v,i)=>(i/(vals.length-1)*(W-4)+2).toFixed(1)+','+(H-3-(v-mn)/r*(H-6)).toFixed(1)).join(' ')}"/></svg>`;}
let OPENLIFT=null;
function vStats(){

 const start=monday(-7);let cells='';const today=iso();
 for(let i=0;i<56;i++){const d=new Date(start);d.setDate(d.getDate()+i);const ds=iso(d);const Lg=S.log.find(x=>x.date===ds);cells+=`<i class="${ds>today?'fut':Lg?(Lg.deload?'dl':'on'):''}" title="${ds}"></i>`;}
 const n4=S.log.filter(x=>x.date>=iso(monday(-3))).length;
 h+=`<div class="card"><div class="row" style="margin-bottom:10px"><h2 class="wide" style="font-size:17px">Consistency</h2><span class="small muted">${n4} session${n4===1?'':'s'} in 4 weeks · aim 20</span></div><div class="heat">${cells}</div></div>`;
 const P=planned(),D=doneWeek(),MX=24;
 h+=`<div class="card"><h2 class="wide" style="font-size:17px;margin-bottom:4px">This week’s volume</h2><p class="small muted" style="margin:0 0 12px">Hard sets per muscle (helping sets count ½). Shaded = target range, line = planned, red = done.</p>`;
 for(const g of['p','s','i','m']){h+=`<div class="small" style="color:var(--red2);font-weight:700;margin:10px 0 8px">${GRP[g]}</div>`;
  Object.keys(M).filter(k=>M[k][3]===g).forEach(k=>{const[l,lo,hi]=M[k],p=P[k]||0,d=D[k]||0;h+=`<div class="vrow"><div class="vl">${l}<span>${fmt(d)} / ${fmt(p)} · aim ${lo}–${hi}</span></div><div class="bar"><div class="bd" style="left:${lo/MX*100}%;width:${(hi-lo)/MX*100}%"></div><div class="dn" style="width:${Math.min(d,MX)/MX*100}%"></div><div class="pl" style="left:calc(${Math.min(p,MX)/MX*100}% - 1px)"></div></div></div>`;});}
 h+=`</div>`;
 const ids=[];for(let i=S.log.length-1;i>=0;i--)S.log[i].entries.forEach(e=>{if(!ids.includes(e.ex))ids.push(e.ex);});
 h+=`<div class="card"><h2 class="wide" style="font-size:17px;margin-bottom:4px">Strength trend</h2><p class="small muted" style="margin:0 0 6px">Estimated 1-rep max from your best set each session — rises whether you add reps or weight.</p>`;
 if(!ids.length)h+=`<p class="small muted">Log a session and every lift shows up here.</p>`;
 ids.forEach(id=>{const ses=[];S.log.forEach(Lg=>{if(Lg.deload)return;const e=Lg.entries.find(x=>x.ex===id);if(e&&e.sets.length)ses.push({d:Lg.date,b:Math.max(...e.sets.map(s=>e1(s.w,s.r,s.rir))),sets:e.sets});});if(!ses.length)return;
  const v=ses.map(s=>s.b),ch=v.length>1?(v[v.length-1]/v[0]-1)*100:null;
  h+=`<button class="lift" data-a="lift" data-x="${id}"><b>${short(ex(id).n)}</b>${spark(v)}<span class="v">${fmt(Math.round(v[v.length-1]))}${ch!=null?`<div class="small ${ch>=0?'dp':'dn2'}">${ch>=0?'+':''}${ch.toFixed(1)}%</div>`:''}</span></button>`;
  if(OPENLIFT===id)h+=`<div class="hist">${ses.slice().reverse().map(s=>`<div>${dstr(s.d)} — ${s.sets.map(t=>fmt(t.w)+'×'+t.r+(t.rir===0?'F':'')).join(', ')}</div>`).join('')}</div>`;});

function vSetup(){
 let h=`<h1 class="wide">Setup</h1><p class="sub">Your programme, training block and data.</p>`;
 h+=DAYS.map(d=>`<div class="card"><div class="row" style="margin-bottom:4px"><h2 class="wide" style="font-size:17px">${d.name}</h2><span class="small muted">${d.slots.length} exercises</span></div>${d.slots.map((s,i)=>{const id=curEx(d.id,i);return`<button class="lib" data-a="form" data-x="${id}" data-d="${d.id}" data-k="${i}"><span class="th">${thumbSvg(id)}</span><span style="flex:1"><b>${ex(id).n}</b><small>${s.sets}×${s.lo}–${s.hi} · ${effort(s.rir)}${s.ss?' · superset '+s.ss:''}</small></span></button>`;}).join('')}</div>`).join('');
 h+=`<details class="card"><summary class="wide" style="font-size:17px;cursor:pointer">How to train it</summary><div style="margin-top:10px;font-size:14.5px;color:#cfd5e3">
 <p><b>Reps.</b> Presses, pulldowns and rows 6–12; isolations 10–20. Growth is similar across that range when sets end near failure — each range is where that lift is safest and easiest to judge.</p>
 <p><b>Effort.</b> Compounds stop 1 rep short. Isolations can go to failure. Failure = the next rep can’t be done with clean form.</p>
 <p><b>Tempo.</b> Lift under control, lower over 2–3 s, don’t skip the stretched bottom. The animations show this rhythm.</p>
 <p><b>Progression.</b> Add reps until every set hits the top of the range, then add weight. Taper works out every target.</p>
 <p><b>Deload.</b> Every ${S.meso}th week: same weights, half the sets, ~3 reps short.</p></div></details>`;
 h+=`<div class="card"><div class="fld"><div>Block started<div class="small muted">Week 1 of this cycle</div></div><input type="date" data-s="start" value="${S.start}"></div>
 <div class="fld"><div>Block length<div class="small muted">Last week is the deload</div></div><select data-s="meso">${[5,6,7,8].map(n=>`<option${S.meso===n?' selected':''}>${n}</option>`).join('')}</select></div>
 <div class="fld"><div>Deload now<div class="small muted">If lifts stall or joints ache</div></div><input type="checkbox" data-s="forceDeload" style="width:26px;height:26px;accent-color:var(--red)"${S.forceDeload?' checked':''}></div></div>
 <div class="card"><div class="fld"><div>Back up<div class="small muted">Saves everything to a file</div></div><button class="pill" data-a="export">Export</button></div>
 <div class="fld"><div>Restore<div class="small muted">From a Taper backup</div></div><label class="pill">Import<input type="file" accept="application/json,.json" data-a="import" hidden></label></div>
 <div class="fld"><div>Reset<div class="small muted">Deletes everything on this phone</div></div><button class="pill" data-a="reset" style="color:var(--red2)">Reset</button></div></div>
 <p class="small muted" style="margin:0 2px 14px">Data lives in this browser only. Export every few weeks — clearing Safari data deletes it.</p>
 <details class="card refs"><summary class="wide" style="font-size:17px;cursor:pointer">Evidence behind the programme</summary>
 <p>Pelland et al. 2025, Sports Med — volume dose-response; counting helping sets as ½ fits best; frequency adds little at equal volume.</p>
 <p>Remmert et al. 2025 (preprint) — per-session returns flatten around ~11 sets per muscle.</p>
 <p>Robinson et al. 2024, Sports Med — growth rises as sets end closer to failure.</p>
 <p>Refalo et al. 2024 — failure vs 1–2 reps in reserve gave similar growth.</p>
 <p>Schoenfeld et al. 2017 — similar growth from light and heavy loads taken near failure.</p>
 <p>Maeo et al. 2023 — overhead extensions out-grew pushdowns, especially the long head.</p>
 <p>Maeo et al. 2021 — seated leg curls out-grew lying curls.</p>
 <p>Pedrosa et al. 2023 — preacher curls in the stretched range out-grew the shortened range.</p>
 <p>Chaves et al. 2024 — incline pressing grew the upper chest more than flat.</p>
 <p>Vispute et al. 2011 — ab training doesn’t burn belly fat; visible abs come from body fat.</p></details>`;
 return h;
}
